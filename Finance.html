  function clearErrors(form) {
    form.querySelectorAll(".err,.form-err").forEach((el) => el.remove());
    form.querySelectorAll("[aria-invalid]").forEach((el) => {
      el.removeAttribute("aria-invalid");
      el.removeAttribute("aria-describedby");
    });
  }

  function showErrors(form, errors) {
    let first = null;
    for (const [name, message] of Object.entries(errors)) {
      const field = name === "_form" ? null : form.querySelector(`[name="${name}"]`);
      if (!field) {
        const p = document.createElement("p");
        p.className = "form-err";
        p.setAttribute("role", "alert");
        p.textContent = message;
        form.querySelector(".dlg-body").appendChild(p);
        continue;
      }
      const span = document.createElement("span");
      span.className = "err";
      span.id = `err-${name}`;
      span.setAttribute("role", "alert");
      span.textContent = message;
      field.closest(".fld").appendChild(span);
      field.setAttribute("aria-invalid", "true");
      field.setAttribute("aria-describedby", span.id);
      if (!first) first = field;
    }
    if (first) first.focus();
  }

  function openForm({ title, body, submit, onSubmit }) {
    dlg.innerHTML = `<form class="dlg-form" novalidate><div class="dlg-head"><h2 id="dlg-title">${title}</h2><button type="button" class="icon-btn" data-close aria-label="বন্ধ করুন">${icon("x")}</button></div><div class="dlg-body">${body}</div><div class="dlg-foot"><button type="button" class="btn ghost" data-close>বাতিল</button><button type="submit" class="btn primary">${submit || "সংরক্ষণ করুন"}</button></div></form>`;
    const form = $("form", dlg);
    let busy = false;
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (busy) return;
      busy = true;
      clearErrors(form);
      try {
        const result = await onSubmit(Object.fromEntries(new FormData(form)));
        if (result && result.errors) showErrors(form, result.errors);
        else dlg.close();
      } finally {
        busy = false;
      }
    });
    dlg.showModal();
    const first = form.querySelector('[name="amount"]') || form.querySelector("input,select");
    if (first) first.focus();
  }

  function confirmDialog({ title, message, confirmLabel = "নিশ্চিত করুন", danger = false, extra = "", requireText = "" }) {
    return new Promise((resolve) => {
      dlg.innerHTML = `<div class="dlg-confirm"><div class="dlg-head"><h2 id="dlg-title">${title}</h2></div><div class="dlg-body"><p>${message}</p>${extra}${requireText ? `<div class="fld"><label for="f-confirm">নিশ্চিত করতে <b>${esc(requireText)}</b> লিখুন</label><input id="f-confirm" type="text" autocomplete="off" autocapitalize="off"></div>` : ""}</div><div class="dlg-foot"><button type="button" class="btn ghost" data-close>বাতিল</button><button type="button" class="btn ${danger ? "danger" : "primary"}" data-ok${requireText ? " disabled" : ""}>${confirmLabel}</button></div></div>`;
      let result = false;
      const ok = $("[data-ok]", dlg);
      ok.addEventListener("click", () => {
        result = true;
        dlg.close();
      });
      const input = $("#f-confirm", dlg);
      if (input) {
        input.addEventListener("input", () => {
          ok.disabled = input.value.trim() !== requireText;
        });
      }
      dlg.addEventListener("close", () => resolve(result), { once: true });
      dlg.showModal();
      (input || $("[data-close]:not(.icon-btn)", dlg)).focus();
    });
  }

  async function saveRecord(store, existing, value) {
    const now = Date.now();
    const rec = existing ? { ...existing, ...value, updatedAt: now } : { id: newId(), ...value, createdAt: now, updatedAt: now };
    await db.put(store, rec);
    const i = state[store].findIndex((x) => x.id === rec.id);
    if (i >= 0) state[store][i] = rec;
    else state[store].push(rec);
    return rec;
  }

  function incomeForm(r) {
    const v = r || { date: today(), type: "salary", note: "", reference: "" };
    openForm({
      title: r ? "আয় সম্পাদনা" : "আয় যোগ করুন",
      body: `${amountField("RM", r ? C.minorToDecimal(r.amountMinor) : "")}
        <div class="two">${inputField({ name: "date", label: "তারিখ", type: "date", value: v.date, required: true })}${selectField({ name: "type", label: "আয়ের ধরন", options: Object.entries(LABELS.income), value: v.type, required: true })}</div>
        ${inputField({ name: "note", label: "বিবরণ / নোট", value: v.note, attrs: 'maxlength="200"' })}
        ${inputField({ name: "reference", label: "রেফারেন্স (ঐচ্ছিক)", value: v.reference, attrs: 'maxlength="80"' })}`,
      onSubmit: async (raw) => {
        const res = C.validateIncome(raw);
        if (!res.ok) return { errors: res.errors };
        try {
          await saveRecord("income", r, res.value);
        } catch (err) {
          return { errors: { _form: SAVE_FAIL } };
        }
        render();
        toast(r ? "আয় আপডেট হয়েছে" : "আয় সংরক্ষিত হয়েছে");
        return null;
      }
    });
  }

  function expenseForm(r) {
    const v = r || { date: today(), category: "food", description: "", note: "" };
    openForm({
      title: r ? "খরচ সম্পাদনা" : "খরচ যোগ করুন",
      body: `${amountField("RM", r ? C.minorToDecimal(r.amountMinor) : "")}
        <div class="two">${inputField({ name: "date", label: "তারিখ", type: "date", value: v.date, required: true })}${selectField({ name: "category", label: "ক্যাটাগরি", options: Object.entries(LABELS.expense), value: v.category, required: true })}</div>
        ${inputField({ name: "description", label: "বিবরণ", value: v.description, required: true, attrs: 'maxlength="120"' })}
        ${inputField({ name: "note", label: "নোট (ঐচ্ছিক)", value: v.note, attrs: 'maxlength="200"' })}`,
      onSubmit: async (raw) => {
        const res = C.validateExpense(raw);
        if (!res.ok) return { errors: res.errors };
        try {
          await saveRecord("expenses", r, res.value);
        } catch (err) {
          return { errors: { _form: SAVE_FAIL } };
        }
        render();
        toast(r ? "খরচ আপডেট হয়েছে" : "খরচ সংরক্ষিত হয়েছে");
        return null;
      }
    });
  }

  function supportForm(r) {
    const v = r || { date: today(), recipient: "", method: "", reference: "" };
    const names = new Set(["বাবা", "মা", "পরিবার"]);
    for (const x of state.support) names.add(x.recipient);
    openForm({
      title: r ? "ট্রান্সফার সম্পাদনা" : "পরিবারকে পাঠানো টাকা",
      body: `${amountField("BDT", r ? C.minorToDecimal(r.amountMinor) : "")}
        <div class="two">${inputField({ name: "date", label: "ট্রান্সফারের তারিখ", type: "date", value: v.date, required: true })}${inputField({ name: "recipient", label: "প্রাপক", value: v.recipient, required: true, list: "recipient-list", attrs: 'maxlength="60" autocomplete="off"' })}</div>
        <datalist id="recipient-list">${[...names].map((n) => `<option value="${esc(n)}"></option>`).join("")}</datalist>
        ${selectField({ name: "method", label: "পদ্ধতি (ঐচ্ছিক)", options: Object.entries(LABELS.method), value: v.method, blank: "— বাছাই নেই —" })}
        ${inputField({ name: "reference", label: "রেফারেন্স / নোট (ঐচ্ছিক)", value: v.reference, attrs: 'maxlength="200"' })}
        <small class="cmp-note">BDT পরিমাণ আপনি নিজে লেখেন। RM থেকে স্বয়ংক্রিয় রূপান্তর বা রেট লাগে না।</small>`,
      onSubmit: async (raw) => {
        const res = C.validateSupport(raw);
        if (!res.ok) return { errors: res.errors };
        try {
          await saveRecord("support", r, res.value);
        } catch (err) {
          return { errors: { _form: SAVE_FAIL } };
        }
        render();
        toast(r ? "ট্রান্সফার আপডেট হয়েছে" : "ট্রান্সফার সংরক্ষিত হয়েছে");
        return null;
      }
    });
  }

  async function removeRecord(store, id) {
    const r = state[store].find((x) => x.id === id);
    if (!r) return;
    const money = store === "support" ? bdt(r.amountMinor) : rm(r.amountMinor);
    const label = store === "support" ? r.recipient : store === "expenses" ? r.description : r.note || LABELS.income[r.type];
    const ok = await confirmDialog({
      title: `এই ${NOUN[store]} মুছবেন?`,
      message: `${esc(fmtDate(r.date))} · ${esc(label)} · <b>${money}</b><br>এটি ফেরানো যাবে না। অন্য কোনো রেকর্ড মুছবে না।`,
      confirmLabel: "মুছে ফেলুন",
      danger: true
    });
    if (!ok) return;
    try {
      await db.remove(store, id);
    } catch (err) {
      toast("মুছে ফেলা যায়নি।");
      return;
    }
    state[store] = state[store].filter((x) => x.id !== id);
    render();
    toast(`${NOUN[store]} মুছে ফেলা হয়েছে`);
  }

  async function setCompletion(month, on) {
    try {
      await db.setCompletion(month, on);
    } catch (err) {
      toast("সংরক্ষণ করা যায়নি।");
      return;
    }
    if (on) state.completion[month] = true;
    else delete state.completion[month];
    render();
    toast(on ? `${monthLabel(month)} সম্পূর্ণ হিসেবে চিহ্নিত` : `${monthLabel(month)} থেকে সম্পূর্ণ চিহ্ন তোলা হয়েছে`);
  }

  async function exportJson() {
    const now = new Date();
    const backup = C.buildBackup(state, state.completion, now.toISOString());
    download(`finance-backup-${C.toDateString(now)}.json`, "application/json", JSON.stringify(backup, null, 2));
    try {
      await db.setMeta("lastBackupAt", now.toISOString());
      state.lastBackupAt = now.toISOString();
    } catch (ignored) {
      toast("ব্যাকআপ ফাইল তৈরি হয়েছে, কিন্তু সময় সংরক্ষণ করা যায়নি।");
      return;
    }
    toast("ব্যাকআপ ফাইল তৈরি হয়েছে");
    if (currentRoute() === "settings" && !dlg.open) render();
  }

  function exportCsv(kind) {
    const stamp = today();
    const files = {
      income: [`finance-income-rm-${stamp}.csv`, C.incomeCSV(state)],
      expenses: [`finance-expenses-rm-${stamp}.csv`, C.expensesCSV(state)],
      support: [`finance-family-support-bdt-${stamp}.csv`, C.supportCSV(state)],
      monthly: [`finance-monthly-summary-${stamp}.csv`, C.monthlyCSV(state, state.completion)]
    };
    const f = files[kind];
    if (!f) return;
    download(f[0], "text/csv;charset=utf-8", f[1]);
    toast("CSV ফাইল তৈরি হয়েছে");
  }

  async function handleRestoreFile(file) {
    if (!file) return;
    if (file.size > 50 * 1024 * 1024) {
      ui.restore = { fileName: file.name, errors: ["ফাইলটি অতিরিক্ত বড় (৫০ MB-এর বেশি)।"], errorCount: 1 };
      refreshRestore();
      return;
    }
    let parsed;
    try {
      parsed = JSON.parse(await file.text());
    } catch (err) {
      ui.restore = { fileName: file.name, errors: ["ফাইলটি পড়া যায়নি। এটি বৈধ JSON নয়।"], errorCount: 1 };
      refreshRestore();
      return;
    }
    const v = C.validateBackup(parsed);
    if (!v.ok) ui.restore = { fileName: file.name, errors: v.errors, errorCount: v.errorCount };
    else ui.restore = { fileName: file.name, backup: v, mode: "merge", plan: C.planImport(state, state.completion, v, "merge") };
    refreshRestore();
  }

  async function runImport() {
    const r = ui.restore;
    if (!r || !r.plan) return;
    if (r.plan.replace) {
      const ok = await confirmDialog({
        title: "সব ডেটা প্রতিস্থাপন করবেন?",
        message: "বর্তমান সব আয়, খরচ ও পরিবার-সহায়তার রেকর্ড মুছে ব্যাকআপ ফাইলের ডেটা বসানো হবে। এটি ফেরানো যাবে না।",
        extra: `<button type="button" class="btn sm" data-act="export-json">${icon("download", "sm")} আগে বর্তমান ডেটার ব্যাকআপ নিন</button>`,
        confirmLabel: "প্রতিস্থাপন করুন",
        danger: true
      });
      if (!ok) return;
    }
    try {
      await db.applyImport(r.plan, Object.keys(state.completion));
      await reloadState();
    } catch (err) {
      toast("ইমপোর্ট ব্যর্থ হয়েছে। আপনার আগের ডেটা অপরিবর্তিত আছে।");
      try {
        await reloadState();
      } catch (ignored) {
        return;
      }
      render();
      return;
    }
    const added = STORES.reduce((t, s) => t + r.plan.add[s].length, 0);
    ui.restore = null;
    render();
    toast(`ইমপোর্ট সম্পন্ন: ${added}টি রেকর্ড যোগ হয়েছে`);
  }

  async function eraseAll() {
    const ok = await confirmDialog({
      title: "সব ডেটা মুছবেন?",
      message: "এই ডিভাইসের সব আয়, খরচ, পরিবার-সহায়তা ও সেটিংস স্থায়ীভাবে মুছে যাবে। এটি ফেরানো যাবে না।",
      extra: `<button type="button" class="btn sm" data-act="export-json">${icon("download", "sm")} আগে ব্যাকআপ নিন</button>`,
      confirmLabel: "সব মুছুন",
      danger: true,
      requireText: "DELETE"
    });
    if (!ok) return;
    try {
      await db.clearAll();
      await reloadState();
    } catch (err) {
      toast("মুছে ফেলা যায়নি।");
      return;
    }
    ui.restore = null;
    render();
    toast("সব ডেটা মুছে ফেলা হয়েছে");
  }

  async function handleAct(el) {
    const act = el.dataset.act;
    const recordAct = /^(add|edit|del)-(income|expenses|support)$/.exec(act);
    if (recordAct) {
      const [, verb, store] = recordAct;
      const existing = verb === "add" ? null : state[store].find((x) => x.id === el.dataset.id);
      if (verb !== "add" && !existing) return;
      if (verb === "del") await removeRecord(store, el.dataset.id);
      else if (store === "income") incomeForm(existing);
      else if (store === "expenses") expenseForm(existing);
      else supportForm(existing);
      return;
    }
    switch (act) {
      case "month-prev":
      case "month-next": {
        const nk = C.shiftMonth(monthlyKey(), act === "month-prev" ? -1 : 1);
        ui.monthly.y = nk.slice(0, 4);
        ui.monthly.m = String(Number(nk.slice(5)));
        render();
        break;
      }
      case "set-complete":
        await setCompletion(el.dataset.month, el.dataset.value === "1");
        break;
      case "export-json":
        await exportJson();
        break;
      case "export-csv":
        exportCsv(el.dataset.kind);
        break;
      case "cancel-restore":
        ui.restore = null;
        refreshRestore();
        break;
      case "do-import":
        await runImport();
        break;
      case "erase":
        await eraseAll();
        break;
      case "persist": {
        let granted = false;
        try {
          granted = Boolean(navigator.storage && navigator.storage.persist && (await navigator.storage.persist()));
        } catch (err) {
          granted = false;
        }
        toast(granted ? "স্থায়ী স্টোরেজ চালু হয়েছে" : "ব্রাউজার স্থায়ী স্টোরেজ অনুমোদন করেনি");
        fillStorageInfo();
        break;
      }
      case "install":
        if (deferredPrompt) {
          deferredPrompt.prompt();
          deferredPrompt = null;
          render();
        }
        break;
      default:
        break;
    }
  }

  function applyFilter(el) {
    const [page, field] = el.dataset.filter.split(".");
    ui[page][field] = el.value;
    if (page === "monthly" || page === "yearly") {
      render();
      const again = document.querySelector(`[data-filter="${el.dataset.filter}"]`);
      if (again) again.focus();
      return;
    }
    refreshRegion();
  }

  view.addEventListener("click", (e) => {
    const el = e.target.closest("[data-act]");
    if (el) handleAct(el);
  });
  view.addEventListener("input", (e) => {
    const el = e.target.closest("[data-filter]");
    if (el) applyFilter(el);
  });
  view.addEventListener("change", (e) => {
    if (e.target.id === "restore-file") {
      handleRestoreFile(e.target.files && e.target.files[0]);
      return;
    }
    if (e.target.matches("[data-restore-mode]") && ui.restore && ui.restore.backup) {
      ui.restore.mode = e.target.value;
      ui.restore.plan = C.planImport(state, state.completion, ui.restore.backup, e.target.value);
      refreshRestore();
      return;
    }
    const el = e.target.closest("[data-filter]");
    if (el && el.tagName === "SELECT") applyFilter(el);
  });
  dlg.addEventListener("click", (e) => {
    if (e.target.closest("[data-close]")) {
      dlg.close();
      return;
    }
    const el = e.target.closest("[data-act]");
    if (el) handleAct(el);
  });
  $("#skip").addEventListener("click", (e) => {
    e.preventDefault();
    view.focus();
  });

  window.addEventListener("hashchange", render);
  window.addEventListener("online", updateNet);
  window.addEventListener("offline", updateNet);
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;
    if (currentRoute() === "settings" && !dlg.open) render();
  });
  window.addEventListener("appinstalled", () => {
    deferredPrompt = null;
  });
  document.addEventListener("visibilitychange", async () => {
    if (document.visibilityState !== "visible" || !state.ready || state.dbError || dlg.open) return;
    try {
      await reloadState();
      render();
    } catch (ignored) {
      return;
    }
  });

  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/service-worker.js", { updateViaCache: "none" }).catch(() => {});
    });
  }

  async function start() {
    buildNav();
    updateNet();
    render();
    try {
      await db.open();
      await reloadState();
    } catch (err) {
      state.dbError = err;
    }
    state.ready = true;
    render();
  }

  start();
})();
</script>
</body>
</html>
