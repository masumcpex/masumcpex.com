:root{

*{box-sizing:border-box}

.app{display:flex;min-height:100vh}

<script id="core">
const FinanceCore = (() => {
  const APP_ID = "personal-finance-tracker";
  const SCHEMA_VERSION = 1;
  const MAX_MINOR = 100000000000;
  const MAX_RECORDS = 200000;
  const STORES = ["income", "expenses", "support"];
  const STORE_LABELS = { income: "Income", expenses: "Expenses", support: "Family Support" };
  const INCOME_TYPES = ["salary", "bonus", "overtime", "other"];
  const EXPENSE_CATEGORIES = ["food", "transport", "mobile", "clothing", "medical", "accommodation", "personal", "other"];
  const TRANSFER_METHODS = ["bank", "remittance", "other"];
  const BN_DIGITS = "০১২৩৪৫৬৭৮৯";

  const SCHEMA = {
    income: {
      enums: { type: INCOME_TYPES },
      optional: [],
      text: { note: 200, reference: 80 },
      required: [],
      content: ["date", "amountMinor", "type", "note", "reference"]
    },
    expenses: {
      enums: { category: EXPENSE_CATEGORIES },
      optional: [],
      text: { description: 120, note: 200 },
      required: ["description"],
      content: ["date", "amountMinor", "category", "description", "note"]
    },
    support: {
      enums: { method: TRANSFER_METHODS },
      optional: ["method"],
      text: { recipient: 60, reference: 200 },
      required: ["recipient"],
      content: ["date", "amountMinor", "recipient", "method", "reference"]
    }
  };

  const pad = (n) => String(n).padStart(2, "0");
  const clean = (v) => String(v === undefined || v === null ? "" : v).trim();

  function escapeHtml(value) {
    return String(value === undefined || value === null ? "" : value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function toLatinDigits(value) {
    return String(value).replace(/[০-৯]/g, (d) => String(BN_DIGITS.indexOf(d)));
  }

  function isValidDate(value) {
    if (typeof value !== "string") return false;
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value);
    if (!m) return false;
    const y = Number(m[1]);
    const mo = Number(m[2]);
    const d = Number(m[3]);
    if (y < 2000 || y > 2100 || mo < 1 || mo > 12 || d < 1) return false;
    const leap = (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
    const days = [31, leap ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
    return d <= days[mo - 1];
  }

  function isValidMonthKey(value) {
    return typeof value === "string" && /^\d{4}-(0[1-9]|1[0-2])$/.test(value);
  }

  function parseMinor(input) {
    const s = toLatinDigits(input).trim().replace(/,/g, "");
    if (!/^\d{1,11}(\.\d{1,2})?$/.test(s)) return null;
    const parts = s.split(".");
    const minor = Number(parts[0]) * 100 + Number((parts[1] || "").padEnd(2, "0"));
    if (minor <= 0 || minor > MAX_MINOR) return null;
    return minor;
  }

  function minorToDecimal(minor) {
    const a = Math.abs(minor);
    return `${minor < 0 ? "-" : ""}${Math.floor(a / 100)}.${pad(a % 100)}`;
  }

  const groupWestern = (s) => s.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  const groupLakh = (s) => (s.length <= 3 ? s : `${s.slice(0, -3).replace(/\B(?=(\d{2})+(?!\d))/g, ",")},${s.slice(-3)}`);

  function splitMinor(minor) {
    const a = Math.abs(minor);
    return { neg: minor < 0, whole: String(Math.floor(a / 100)), frac: pad(a % 100) };
  }

  function formatRM(minor) {
    const p = splitMinor(minor);
    return `${p.neg ? "-" : ""}RM ${groupWestern(p.whole)}.${p.frac}`;
  }

  function formatBDT(minor) {
    const p = splitMinor(minor);
    return `${p.neg ? "-" : ""}৳${groupLakh(p.whole)}${p.frac === "00" ? "" : `.${p.frac}`}`;
  }

  const formatSignedBDT = (minor) => (minor > 0 ? `+${formatBDT(minor)}` : formatBDT(minor));
  const formatSignedRM = (minor) => (minor > 0 ? `+${formatRM(minor)}` : formatRM(minor));

  const toDateString = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const monthKey = (date) => date.slice(0, 7);

  function shiftMonth(key, delta) {
    const [y, m] = key.split("-").map(Number);
    const t = y * 12 + (m - 1) + delta;
    return `${Math.floor(t / 12)}-${pad((t % 12) + 1)}`;
  }

  const sum = (list) => list.reduce((total, r) => total + r.amountMinor, 0);
  const inMonth = (list, key) => list.filter((r) => monthKey(r.date) === key);

  function supportState(count, complete) {
    if (count > 0) return complete ? "complete" : "incomplete";
    return complete ? "confirmed-zero" : "no-records";
  }

  function monthSummary(data, key, completion) {
    const inc = inMonth(data.income, key);
    const exp = inMonth(data.expenses, key);
    const sup = inMonth(data.support, key);
    const incomeMinor = sum(inc);
    const expenseMinor = sum(exp);
    const supportComplete = Boolean(completion && completion[key]);
    return {
      month: key,
      incomeMinor,
      expenseMinor,
      balanceMinor: incomeMinor - expenseMinor,
      supportMinor: sum(sup),
      incomeCount: inc.length,
      expenseCount: exp.length,
      supportCount: sup.length,
      supportComplete,
      supportState: supportState(sup.length, supportComplete)
    };
  }

  function lifetimeSummary(data) {
    const incomeMinor = sum(data.income);
    const expenseMinor = sum(data.expenses);
    return {
      incomeMinor,
      expenseMinor,
      balanceMinor: incomeMinor - expenseMinor,
      supportMinor: sum(data.support),
      incomeCount: data.income.length,
      expenseCount: data.expenses.length,
      supportCount: data.support.length,
      recordCount: data.income.length + data.expenses.length + data.support.length
    };
  }

  function compareAmounts(prevMinor, curMinor) {
    const diffMinor = curMinor - prevMinor;
    const status = diffMinor > 0 ? "up" : diffMinor < 0 ? "down" : "same";
    const percentAvailable = prevMinor > 0;
    const percent = percentAvailable ? Math.round((Math.abs(diffMinor) * 10000) / prevMinor) / 100 : null;
    return {
      status,
      diffMinor,
      percentAvailable,
      percent,
      zeroBaseline: !percentAvailable && diffMinor !== 0
    };
  }

  function yearSummary(data, year, completion) {
    const months = [];
    for (let i = 1; i <= 12; i++) months.push(monthSummary(data, `${year}-${pad(i)}`, completion));
    const totals = {
      incomeMinor: months.reduce((t, m) => t + m.incomeMinor, 0),
      expenseMinor: months.reduce((t, m) => t + m.expenseMinor, 0),
      supportMinor: months.reduce((t, m) => t + m.supportMinor, 0),
      supportCount: months.reduce((t, m) => t + m.supportCount, 0)
    };
    totals.balanceMinor = totals.incomeMinor - totals.expenseMinor;
    const withSupport = months.filter((m) => m.supportCount > 0);
    let highest = null;
    let lowest = null;
    for (const m of withSupport) {
      if (!highest || m.supportMinor > highest.supportMinor) highest = m;
      if (!lowest || m.supportMinor < lowest.supportMinor) lowest = m;
    }
    return { year: String(year), months, totals, highest, lowest };
  }

  function filterRecords(list, f) {
    const o = f || {};
    const q = clean(o.query).toLowerCase();
    const fields = o.searchFields || [];
    return list.filter((r) => {
      if (o.year && r.date.slice(0, 4) !== String(o.year)) return false;
      if (o.month && Number(r.date.slice(5, 7)) !== Number(o.month)) return false;
      if (o.field && o.value && r[o.field] !== o.value) return false;
      if (q) {
        const hay = fields.map((k) => r[k] || "").join(" ").toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
  }

  const sortRecords = (list) =>
    [...list].sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : (b.createdAt || 0) - (a.createdAt || 0)));

  function yearsPresent(data) {
    const years = new Set();
    for (const store of STORES) for (const r of data[store]) years.add(r.date.slice(0, 4));
    return [...years].sort().reverse();
  }

  function sumByKey(list, field) {
    const out = {};
    for (const r of list) out[r[field]] = (out[r[field]] || 0) + r.amountMinor;
    return out;
  }

  function checkDateAmount(raw, errors) {
    const date = clean(raw.date);
    if (!isValidDate(date)) errors.date = "সঠিক তারিখ দিন।";
    const amountMinor = parseMinor(raw.amount === undefined || raw.amount === null ? "" : raw.amount);
    if (amountMinor === null) errors.amount = "সঠিক পরিমাণ দিন, যেমন 1250 বা 1250.50 (সর্বোচ্চ ২ দশমিক ঘর)।";
    return { date, amountMinor };
  }

  function lengthCheck(errors, field, value, max) {
    if (value.length > max) errors[field] = `সর্বোচ্চ ${max} অক্ষর।`;
  }

  function validateIncome(raw) {
    const errors = {};
    const { date, amountMinor } = checkDateAmount(raw, errors);
    const type = clean(raw.type);
    if (!INCOME_TYPES.includes(type)) errors.type = "আয়ের ধরন বাছুন।";
    const note = clean(raw.note);
    const reference = clean(raw.reference);
    lengthCheck(errors, "note", note, 200);
    lengthCheck(errors, "reference", reference, 80);
    return Object.keys(errors).length ? { ok: false, errors } : { ok: true, value: { date, amountMinor, type, note, reference } };
  }

  function validateExpense(raw) {
    const errors = {};
    const { date, amountMinor } = checkDateAmount(raw, errors);
    const category = clean(raw.category);
    if (!EXPENSE_CATEGORIES.includes(category)) errors.category = "খরচের ক্যাটাগরি বাছুন।";
    const description = clean(raw.description);
    if (!description) errors.description = "খরচের বিবরণ লিখুন।";
    lengthCheck(errors, "description", description, 120);
    const note = clean(raw.note);
    lengthCheck(errors, "note", note, 200);
    return Object.keys(errors).length ? { ok: false, errors } : { ok: true, value: { date, amountMinor, category, description, note } };
  }

  function validateSupport(raw) {
    const errors = {};
    const { date, amountMinor } = checkDateAmount(raw, errors);
    const recipient = clean(raw.recipient);
    if (!recipient) errors.recipient = "প্রাপকের নাম লিখুন।";
    lengthCheck(errors, "recipient", recipient, 60);
    const method = clean(raw.method);
    if (method && !TRANSFER_METHODS.includes(method)) errors.method = "পদ্ধতি অবৈধ।";
    const reference = clean(raw.reference);
    lengthCheck(errors, "reference", reference, 200);
    return Object.keys(errors).length ? { ok: false, errors } : { ok: true, value: { date, amountMinor, recipient, method, reference } };
  }

  function normalizeRecord(store, raw, fail) {
    const spec = SCHEMA[store];
    if (!raw || typeof raw !== "object" || Array.isArray(raw)) return fail("অবৈধ রেকর্ড।");
    if (typeof raw.id !== "string" || !/^[A-Za-z0-9][A-Za-z0-9._-]{0,35}$/.test(raw.id)) return fail("আইডি অবৈধ।");
    if (!isValidDate(raw.date)) return fail("তারিখ অবৈধ।");
    if (!Number.isSafeInteger(raw.amountMinor) || raw.amountMinor <= 0 || raw.amountMinor > MAX_MINOR) return fail("পরিমাণ অবৈধ।");
    const rec = { id: raw.id, date: raw.date, amountMinor: raw.amountMinor };
    for (const [field, allowed] of Object.entries(spec.enums)) {
      const value = raw[field] === undefined || raw[field] === null ? "" : raw[field];
      if (value === "" && spec.optional.includes(field)) {
        rec[field] = "";
        continue;
      }
      if (!allowed.includes(value)) return fail(`"${field}" মান অবৈধ।`);
      rec[field] = value;
    }
    for (const [field, max] of Object.entries(spec.text)) {
      const value = raw[field] === undefined || raw[field] === null ? "" : raw[field];
      if (typeof value !== "string" || value.length > max) return fail(`"${field}" অবৈধ।`);
      if (spec.required.includes(field) && value.trim() === "") return fail(`"${field}" ফাঁকা।`);
      rec[field] = value;
    }
    rec.createdAt = Number.isFinite(raw.createdAt) ? raw.createdAt : 0;
    rec.updatedAt = Number.isFinite(raw.updatedAt) ? raw.updatedAt : rec.createdAt;
    return rec;
  }

  function buildBackup(data, completion, nowIso) {
    const out = { app: APP_ID, schemaVersion: SCHEMA_VERSION, createdAt: nowIso };
    for (const store of STORES) {
      out[store] = sortRecords(data[store])
        .reverse()
        .map((r) => {
          const rec = { id: r.id, date: r.date, amountMinor: r.amountMinor };
          for (const field of [...Object.keys(SCHEMA[store].enums), ...Object.keys(SCHEMA[store].text)]) rec[field] = r[field] || "";
          rec.createdAt = r.createdAt || 0;
          rec.updatedAt = r.updatedAt || 0;
          return rec;
        });
    }
    out.completion = {};
    for (const key of Object.keys(completion || {}).sort()) if (completion[key]) out.completion[key] = true;
    return out;
  }

  function validateBackup(input) {
    const errors = [];
    if (!input || typeof input !== "object" || Array.isArray(input)) {
      return { ok: false, errors: ["ফাইলটি সঠিক ব্যাকআপ ফরম্যাটে নয়।"], errorCount: 1 };
    }
    if (input.app !== APP_ID) errors.push("এটি এই অ্যাপের ব্যাকআপ ফাইল নয়।");
    if (!Number.isInteger(input.schemaVersion) || input.schemaVersion < 1) errors.push("স্কিমা ভার্সন অনুপস্থিত বা অবৈধ।");
    else if (input.schemaVersion > SCHEMA_VERSION) errors.push("এই ব্যাকআপ নতুন ভার্সনের, তাই এই অ্যাপে ইমপোর্ট করা যাবে না।");
    if (typeof input.createdAt !== "string" || Number.isNaN(Date.parse(input.createdAt))) errors.push("ব্যাকআপ তৈরির সময় অবৈধ।");
    const data = { income: [], expenses: [], support: [] };
    for (const store of STORES) {
      const list = input[store];
      if (!Array.isArray(list)) {
        errors.push(`${STORE_LABELS[store]} তালিকা পাওয়া যায়নি।`);
        continue;
      }
      if (list.length > MAX_RECORDS) {
        errors.push(`${STORE_LABELS[store]}-এ রেকর্ড সংখ্যা সীমার বেশি।`);
        continue;
      }
      const seen = new Set();
      list.forEach((raw, i) => {
        const rec = normalizeRecord(store, raw, (msg) => {
          errors.push(`${STORE_LABELS[store]} #${i + 1}: ${msg}`);
          return null;
        });
        if (!rec) return;
        if (seen.has(rec.id)) {
          errors.push(`${STORE_LABELS[store]} #${i + 1}: একই আইডি একাধিকবার আছে।`);
          return;
        }
        seen.add(rec.id);
        data[store].push(rec);
      });
    }
    const completion = {};
    if (input.completion !== undefined) {
      if (!input.completion || typeof input.completion !== "object" || Array.isArray(input.completion)) {
        errors.push("মাস সম্পূর্ণ-চিহ্নের তথ্য অবৈধ।");
      } else {
        for (const [key, value] of Object.entries(input.completion)) {
          if (!isValidMonthKey(key) || value !== true) errors.push(`মাস সম্পূর্ণ-চিহ্ন অবৈধ: ${String(key).slice(0, 20)}`);
          else completion[key] = true;
        }
      }
    }
    if (errors.length) return { ok: false, errors: errors.slice(0, 12), errorCount: errors.length };
    return { ok: true, errors: [], errorCount: 0, data, completion, createdAt: input.createdAt };
  }

  const contentKey = (store, r, withId) =>
    JSON.stringify([...(withId ? [r.id] : []), ...SCHEMA[store].content.map((k) => (r[k] === undefined || r[k] === null ? "" : r[k]))]);

  function planImport(existing, existingCompletion, backup, mode) {
    const replace = mode === "replace";
    const plan = {
      mode: replace ? "replace" : "merge",
      replace,
      add: { income: [], expenses: [], support: [] },
      identical: 0,
      conflicts: 0,
      possibleDuplicates: 0,
      completionToSet: []
    };
    for (const store of STORES) {
      const byId = new Map(existing[store].map((r) => [r.id, r]));
      const signatures = new Set(existing[store].map((r) => contentKey(store, r, false)));
      for (const rec of backup.data[store]) {
        if (replace) {
          plan.add[store].push(rec);
          continue;
        }
        const found = byId.get(rec.id);
        if (!found) {
          if (signatures.has(contentKey(store, rec, false))) plan.possibleDuplicates++;
          plan.add[store].push(rec);
        } else if (contentKey(store, found, true) === contentKey(store, rec, true)) plan.identical++;
        else plan.conflicts++;
      }
    }
    for (const key of Object.keys(backup.completion)) {
      if (replace || !(existingCompletion && existingCompletion[key])) plan.completionToSet.push(key);
    }
    return plan;
  }

  function applyImport(existing, existingCompletion, plan) {
    const next = { income: [], expenses: [], support: [] };
    const completion = plan.replace ? {} : { ...existingCompletion };
    for (const store of STORES) {
      const base = plan.replace ? [] : existing[store];
      next[store] = [...base, ...plan.add[store]];
    }
    for (const key of plan.completionToSet) completion[key] = true;
    return { data: next, completion };
  }

  const toDecimalOrEmpty = (minor) => minorToDecimal(minor);

  function csvCell(value) {
    let s = value === undefined || value === null ? "" : String(value);
    if (/^[=+\-@\t\r]/.test(s)) s = `'${s}`;
    if (/[",\n\r]/.test(s)) s = `"${s.replace(/"/g, '""')}"`;
    return s;
  }

  function toCSV(headers, rows) {
    return `\uFEFF${[headers, ...rows].map((r) => r.map(csvCell).join(",")).join("\r\n")}\r\n`;
  }

  const asc = (list) => sortRecords(list).reverse();

  const incomeCSV = (data) =>
    toCSV(["date", "type", "amount_rm", "note", "reference"], asc(data.income).map((r) => [r.date, r.type, toDecimalOrEmpty(r.amountMinor), r.note, r.reference]));

  const expensesCSV = (data) =>
    toCSV(["date", "category", "amount_rm", "description", "note"], asc(data.expenses).map((r) => [r.date, r.category, toDecimalOrEmpty(r.amountMinor), r.description, r.note]));

  const supportCSV = (data) =>
    toCSV(["date", "recipient", "amount_bdt", "method", "reference"], asc(data.support).map((r) => [r.date, r.recipient, toDecimalOrEmpty(r.amountMinor), r.method, r.reference]));

  function monthsRange(data) {
    let min = null;
    let max = null;
    for (const store of STORES) {
      for (const r of data[store]) {
        const k = monthKey(r.date);
        if (min === null || k < min) min = k;
        if (max === null || k > max) max = k;
      }
    }
    const out = [];
    if (min === null) return out;
    for (let k = min; k <= max; k = shiftMonth(k, 1)) out.push(k);
    return out;
  }

  function monthlyCSV(data, completion) {
    const rows = monthsRange(data).map((key) => {
      const s = monthSummary(data, key, completion);
      return [
        key,
        toDecimalOrEmpty(s.incomeMinor),
        toDecimalOrEmpty(s.expenseMinor),
        toDecimalOrEmpty(s.balanceMinor),
        toDecimalOrEmpty(s.supportMinor),
        s.supportCount,
        s.supportComplete ? "yes" : "no"
      ];
    });
    return toCSV(["month", "income_rm", "expenses_rm", "balance_rm", "family_support_bdt", "family_support_transfers", "family_support_marked_complete"], rows);
  }

  return {
    APP_ID,
    SCHEMA_VERSION,
    INCOME_TYPES,
    EXPENSE_CATEGORIES,
    TRANSFER_METHODS,
    escapeHtml,
    toLatinDigits,
    isValidDate,
    isValidMonthKey,
    parseMinor,
    minorToDecimal,
    formatRM,
    formatBDT,
    formatSignedBDT,
    formatSignedRM,
    toDateString,
    monthKey,
    shiftMonth,
    sum,
    monthSummary,
    lifetimeSummary,
    compareAmounts,
    yearSummary,
    filterRecords,
    sortRecords,
    yearsPresent,
    sumByKey,
    validateIncome,
    validateExpense,
    validateSupport,
    buildBackup,
    validateBackup,
    planImport,
    applyImport,
    csvCell,
    incomeCSV,
    expensesCSV,
    supportCSV,
    monthlyCSV
  };
})();

  async function writeRow(store, id, rec, isUpdate) {
    const call = (mode) =>
      isUpdate ? cloud.updateRow(store, id, toRowData(store, rec, mode === "pad" ? "pad" : "update")) : cloud.createRow(store, id, toRowData(store, rec, mode), state.user.id);
    const friendly = (err) => {
      const m = err && /Unknown attribute: "?([A-Za-z0-9_]+)"?/i.exec(String(err.message || ""));
      if (!m) return err;
      return new ApiError(`Appwrite-এর "${store}" টেবিলে "${m[1]}" নামের কলাম নেই। Columns ট্যাবে এই নামে কলাম যোগ করুন।`, 400, "unknown_column");
    };
    try {
      return await call("normal");
    } catch (err) {
      if (err && err.status === 400 && !/Unknown attribute/i.test(String(err.message || ""))) {
        try {
          return await call("pad");
        } catch (err2) {
          throw friendly(err2);
        }
      }
      throw friendly(err);
    }
  }

  function fromRow(store, row) {
    const rec = { id: row.$id };
    for (const f of FIELDS[store]) {
      const v = row[column(store, f)];
      rec[f] = v === undefined || v === null ? "" : typeof v === "string" ? v.trim() : v;
    }
    rec.createdAt = Date.parse(row.$createdAt) || 0;
    rec.updatedAt = Date.parse(row.$updatedAt) || rec.createdAt;
    return rec;
  }

  const requestResult = (r) =>
    new Promise((resolve, reject) => {
      r.onsuccess = () => resolve(r.result);
      r.onerror = () => reject(r.error);
    });

  async function readLegacyLocal() {
    if (!window.indexedDB || !indexedDB.databases) return null;
    try {
      const all = await indexedDB.databases();
      if (!all.some((d) => d.name === LEGACY_DB)) return null;
      const handle = await new Promise((resolve, reject) => {
        const req = indexedDB.open(LEGACY_DB);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
      try {
        const names = [...STORES, "meta"].filter((s) => handle.objectStoreNames.contains(s));
        if (!names.length) return null;
        const tx = handle.transaction(names, "readonly");
        const read = (s) => (names.includes(s) ? requestResult(tx.objectStore(s).getAll()) : Promise.resolve([]));
        const [income, expenses, support, meta] = await Promise.all([read("income"), read("expenses"), read("support"), read("meta")]);
        const completion = {};
        for (const m of meta) if (m.key.startsWith("completion:") && m.value === true) completion[m.key.slice(11)] = true;
        const count = income.length + expenses.length + support.length;
        return count || Object.keys(completion).length ? { income, expenses, support, completion, count } : null;
      } finally {
        handle.close();
      }
    } catch (err) {
      return null;
    }
  }

  const lastBackupKey = () => `finance-last-backup:${state.user ? state.user.id : ""}`;

  const state = { loans: [], loansStatus: "idle", user: null, income: [], expenses: [], support: [], completion: {}, completionIds: {}, lastBackupAt: null, legacy: null, ready: false, bootError: null, loadError: null };

  const nowDate = new Date();
  const ui = {
    income: { year: "", month: "", type: "", query: "" },
    expenses: { year: "", month: "", type: "", query: "" },
    support: { year: "", month: "", query: "" },
    monthly: { y: String(nowDate.getFullYear()), m: String(nowDate.getMonth() + 1) },
    yearly: { year: String(nowDate.getFullYear()) },
    restore: null,
    auth: { mode: "login" },
    authBusy: false,
    importing: false
  };

  const isAdmin = () => !!(state.user && state.user.id === ADMIN_ID);

  /* Each signed-in user keeps one small profile row (name, email, last seen) so the admin can see who uses the app. */
  async function touchProfile() {
    state.profileErr = "";
    if (!APPWRITE.tables.profiles || !state.user) return;
    const u = state.user;
    const data = { name: u.name || String(u.email || "").split("@")[0], email: u.email || "", lastSeen: new Date().toISOString() };
    try {
      await api("PATCH", `${rowsPath("profiles")}/${encodeURIComponent(u.id)}`, { data });
    } catch (err) {
      if (err && err.status === 404) {
        try {
          await cloud.createRow("profiles", u.id, data, u.id);
        } catch (e) {
          state.profileErr = errorMessage(e);
        }
      } else {
        state.profileErr = errorMessage(err);
      }
    }
  }

  function adminListHtml(rows) {
    if (!rows.length) return `<p class="cmp-note">এখনো কোনো ব্যবহারকারী পাওয়া যায়নি।</p>`;
    const items = rows
      .slice()
      .sort((a, b) => String(b.lastSeen || "").localeCompare(String(a.lastSeen || "")))
      .map((r) => {
        const label = r.name || r.email || "?";
        const when = r.lastSeen ? new Date(r.lastSeen).toLocaleString("bn-BD", { dateStyle: "medium", timeStyle: "short" }) : "—";
        const me = r.$id === ADMIN_ID ? " (আপনি)" : "";
        return `<li><span class="avatar" aria-hidden="true">${esc(label.trim()[0].toUpperCase())}</span><div><b>${esc(label)}${me}</b><small>${esc(r.email || "")}</small></div><span class="when">শেষ ব্যবহার<br>${esc(when)}</span></li>`;
      })
      .join("");
    return `<p class="cmp-note">মোট ${rows.length} জন ব্যবহারকারী। এখানে শুধু নাম, ইমেইল ও শেষ ব্যবহারের সময় দেখা যায়, কারও আয়-ব্যয়ের রেকর্ড নয়।</p><ul class="adm-list">${items}</ul>`;
  }

  async function loadAdminUsers() {
    const el = $("#admin-region");
    if (!el || !isAdmin()) return;
    if (!APPWRITE.tables.profiles) {
      el.innerHTML = `<p class="cmp-note">এই কার্ড চালু করতে Appwrite-এ <b>profiles</b> নামে একটা টেবিল বানিয়ে তার Table ID ফাইলের <b>tables.profiles</b>-এ বসান।</p>`;
      return;
    }
    el.innerHTML = `<p class="cmp-note">লোড হচ্ছে…</p>`;
    try {
      await touchProfile();
      const rows = await cloud.listAll("profiles");
      const warn = state.profileErr ? `<p class="cmp-note" style="color:var(--red)">আপনার প্রোফাইল সেভ হয়নি: ${esc(state.profileErr)}</p>` : "";
      el.innerHTML = warn + adminListHtml(rows);
    } catch (err) {
      el.innerHTML = `<p class="cmp-note" style="color:var(--red)">তালিকা আনা যায়নি: ${esc(errorMessage(err))}</p>`;
    }
  }

  function fetchAllTables() {
    return Promise.all(
      [...STORES, "completion"].map((t) =>
        cloud.listAll(t).then(
          (value) => ({ status: "fulfilled", value }),
          (reason) => ({ status: "rejected", reason })
        )
      )
    );
  }

  async function reloadState(pre) {
    const tables = [...STORES, "completion"];
    const settled = await (pre || fetchAllTables());
    const failed = settled.map((r, i) => ({ r, table: tables[i] })).filter((x) => x.r.status === "rejected");
    if (failed.length) {
      const notFound = failed.filter((x) => x.r.reason && x.r.reason.status === 404 && /not_found/.test(x.r.reason.type));
      if (notFound.length === failed.length) {
        if (notFound.some((x) => /database_not_found/.test(x.r.reason.type))) {
          throw new ApiError(`ডাটাবেস "${APPWRITE.databaseId}" পাওয়া যায়নি। নাম নয়, Database ID লাগবে।`, 404, "database_not_found");
        }
        const names = notFound.map((x) => `"${APPWRITE.tables[x.table]}"`).join(", ");
        throw new ApiError(`এই টেবিলগুলো পাওয়া যায়নি: ${names}। প্রতিটি টেবিলের Settings থেকে Table ID কপি করে Finance.html-এর tables ব্লকে বসান।`, 404, "table_not_found");
      }
      const detail = failed.map((x) => `${x.table}: ${(x.r.reason && x.r.reason.message) || "error"} [${(x.r.reason && x.r.reason.status) || ""}]`).join(" | ");
      throw new ApiError(detail, failed[0].r.reason.status, failed[0].r.reason.type);
    }
    const lists = settled.map((r) => r.value);
    STORES.forEach((s, i) => {
      state[s] = lists[i].map((row) => fromRow(s, row));
    });
    state.completion = {};
    state.completionIds = {};
    for (const row of lists[3]) {
      if (C.isValidMonthKey(row.month)) {
        state.completion[row.month] = true;
        state.completionIds[row.month] = row.$id;
      }
    }
    state.lastBackupAt = readStorage(lastBackupKey()) || null;
    await loadLoans();
  }

  function errorMessage(err) {
    if (!err) return "অজানা সমস্যা হয়েছে।";
    if (err.status === 0) return "ইন্টারনেট সংযোগ পাওয়া যায়নি। নেট চালু আছে কিনা দেখে আবার চেষ্টা করুন।";
    if (err.status === 401) return "লগইন সেশন শেষ হয়েছে। আবার লগইন করুন।";
    if (err.status === 404) return /^(টেবিল|ডাটাবেস|এই টেবিলগুলো)/.test(err.message) ? err.message : "ডাটাবেস বা টেবিল পাওয়া যায়নি। Database ID ও Table ID যাচাই করুন।";
    if (err.status === 409) return "এই রেকর্ড বা ইমেইল আগে থেকেই আছে।";
    if (err.status === 429) return "অনেকবার অনুরোধ হয়েছে। কিছুক্ষণ পরে আবার চেষ্টা করুন।";
    return err.message || "অজানা সমস্যা হয়েছে।";
  }

  function failMessage(err) {
    if (err && err.status === 401 && state.user) {
      state.user = null;
      render();
    }
    return errorMessage(err);
  }

  async function enter(user, pre) {
    state.user = { id: user.$id, email: user.email, name: user.name || "", picture: (user.prefs && user.prefs.picture) || "" };
    state.loadError = null;
    touchProfile();
    try {
      await reloadState(pre);
    } catch (err) {
      state.loadError = err;
    }
    state.legacy = await readLegacyLocal();
  }

  const newId = () =>
    typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;

  const icon = (name, cls = "") => `<svg class="ic ${cls}" aria-hidden="true" focusable="false"><use href="#i-${name}"/></svg>`;
  const today = () => C.toDateString(new Date());
  const thisMonth = () => C.monthKey(today());
  const fmtDate = (s) => {
    const [y, m, d] = s.split("-").map(Number);
    return `${d} ${MONTH_NAMES[m - 1]} ${y}`;
  };
  const monthLabel = (key) => {
    const [y, m] = key.split("-").map(Number);
    return `${MONTH_NAMES[m - 1]} ${y}`;
  };
  const pad2 = (n) => String(n).padStart(2, "0");
  const monthlyKey = () => `${ui.monthly.y}-${pad2(ui.monthly.m)}`;

  function compact(minor) {
    const units = minor / 100;
    if (units >= 1000000) return `${(units / 1000000).toFixed(1).replace(/\.0$/, "")}M`;
    if (units >= 1000) return `${(units / 1000).toFixed(1).replace(/\.0$/, "")}k`;
    return String(Math.round(units));
  }

  const tile = (k, v, o = {}) =>
    `<div class="tile ${o.cls || ""}"><span class="k">${k}</span><span class="v${o.neg ? " neg" : ""}">${v}</span>${o.sub ? `<span class="s">${o.sub}</span>` : ""}</div>`;

  const secHead = (title, cur) => `<div class="sec-head"><h2>${title}</h2><span class="chip ${cur.toLowerCase()}">${cur}</span></div>`;

  const emptyBox = (iconName, title, text, act, actLabel) =>
    `<div class="empty">${icon(iconName)}<b>${title}</b>${text ? `<p>${text}</p>` : ""}${act ? `<button type="button" class="btn primary" data-act="${act}">${icon("plus")} ${actLabel}</button>` : ""}</div>`;

  function statusBadge(cmp) {
    if (cmp.status === "up") return `<span class="badge up">${icon("arrow-up", "sm")} UP${cmp.percentAvailable ? ` — ${cmp.percent}% increase` : ""}</span>`;
    if (cmp.status === "down") return `<span class="badge down">${icon("arrow-down", "sm")} DOWN${cmp.percentAvailable ? ` — ${cmp.percent}% decrease` : ""}</span>`;
    return `<span class="badge same">${icon("minus", "sm")} NO CHANGE</span>`;
  }

  const SUPPORT_STATE = {
    complete: { cls: "ok", text: "সম্পূর্ণ হিসেবে চিহ্নিত", ic: "check" },
    incomplete: { cls: "warn", text: "অসম্পূর্ণ হতে পারে", ic: "alert" },
    "confirmed-zero": { cls: "ok", text: "নিশ্চিত শূন্য", ic: "check" },
    "no-records": { cls: "mute", text: "কোনো রেকর্ড নেই", ic: "minus" }
  };
  const supportBadge = (s) => `<span class="badge ${SUPPORT_STATE[s].cls}">${icon(SUPPORT_STATE[s].ic, "sm")} ${SUPPORT_STATE[s].text}</span>`;

  function completionControl(key) {
    const done = Boolean(state.completion[key]);
    const s = C.monthSummary(state, key, state.completion);
    return `<div class="comp-row"><span><b>${monthLabel(key)}</b> ${supportBadge(s.supportState)}</span><button type="button" class="btn sm ${done ? "ghost" : "primary"}" data-act="set-complete" data-month="${key}" data-value="${done ? "0" : "1"}">${done ? "সম্পূর্ণ চিহ্ন তুলুন" : "সম্পূর্ণ হিসেবে চিহ্নিত করুন"}</button></div>`;
  }

  function comparisonCard(key) {
    const prevKey = C.shiftMonth(key, -1);
    const cur = C.monthSummary(state, key, state.completion);
    const prev = C.monthSummary(state, prevKey, state.completion);
    const cmp = C.compareAmounts(prev.supportMinor, cur.supportMinor);
    const incomplete = [prev, cur].filter((m) => !m.supportComplete).map((m) => monthLabel(m.month));
    const notes = [];
    if (cmp.zeroBaseline) notes.push(`আগের মাসের পরিমাণ ${bdt(0)}, তাই শতাংশ হিসাব করা যায় না। শুধু পরিমাণের পার্থক্য দেখানো হয়েছে।`);
    notes.push("এটি রেকর্ড করা পরিমাণের তথ্যগত পরিবর্তন মাত্র; বাড়া বা কমা ভালো বা খারাপ বোঝায় না।");
    return `<section class="card" aria-labelledby="cmp-title">
      <h3 id="cmp-title">Family Support — মাসের তুলনা (শুধু BDT)</h3>
      <div class="cmp-grid">
        <div><span class="k">${monthLabel(prevKey)}</span><b>${bdt(prev.supportMinor)}</b></div>
        <div><span class="k">${monthLabel(key)}</span><b>${bdt(cur.supportMinor)}</b></div>
        <div><span class="k">পার্থক্য</span><b>${C.formatSignedBDT(cmp.diffMinor)}</b></div>
      </div>
      <div class="cmp-result">${statusBadge(cmp)}</div>
      ${notes.map((n) => `<p class="cmp-note">${n}</p>`).join("")}
      ${incomplete.length ? `<div class="banner warn">${icon("alert")}<span>${incomplete.join(" ও ")} মাসের পরিবার-সহায়তার রেকর্ড সম্পূর্ণ হিসেবে চিহ্নিত নয়। তাই এই তুলনা অসম্পূর্ণ তথ্যের ওপর ভিত্তি করে হতে পারে।</span></div>` : ""}
      ${completionControl(prevKey)}
      ${completionControl(key)}
    </section>`;
  }

  function vchart({ labels, series, format, selected = -1, showValues = false, label }) {
    const max = Math.max(1, ...series.flatMap((s) => s.values));
    const summary = `${label}: ${labels.map((l, i) => `${l} ${series.map((s) => `${s.name} ${format(s.values[i])}`).join(", ")}`).join("; ")}`;
    const cols = labels
      .map((l, i) => {
        const bars = series
          .map((s) => {
            const v = s.values[i];
            const h = v > 0 ? Math.max(2, Math.round((v / max) * 100)) : 0;
            return `<i class="bar ${s.cls}" style="height:${h}%" title="${esc(`${s.name}: ${format(v)}`)}"></i>`;
          })
          .join("");
        const val = showValues ? `<span class="val">${series[0].values[i] > 0 ? compact(series[0].values[i]) : ""}</span>` : "";
        return `<div class="vcol${i === selected ? " sel" : ""}">${val}<div class="bars">${bars}</div><span class="lab">${esc(l)}</span></div>`;
      })
      .join("");
    const legend =
      series.length > 1 ? `<div class="legend">${series.map((s) => `<span><i class="${s.cls}"></i>${esc(s.name)}</span>`).join("")}</div>` : "";
    return `<div class="vchart" role="img" aria-label="${esc(summary)}">${cols}</div>${legend}`;
  }

  function recordRow(store, r, editable) {
    let title;
    let tags;
    let amt;
    let cls;
    if (store === "income") {
      title = r.note || LABELS.income[r.type];
      tags = [`<span class="tag">${esc(LABELS.income[r.type])}</span>`, r.reference ? `রেফ: ${esc(r.reference)}` : ""];
      amt = rm(r.amountMinor);
      cls = "rm";
    } else if (store === "expenses") {
      title = r.description;
      tags = [`<span class="tag">${esc(LABELS.expense[r.category])}</span>`, r.note ? esc(r.note) : ""];
      amt = rm(r.amountMinor);
      cls = "rm";
    } else {
      title = r.recipient;
      tags = [r.method ? `<span class="tag">${esc(LABELS.method[r.method])}</span>` : "", r.reference ? esc(r.reference) : ""];
      amt = bdt(r.amountMinor);
      cls = "bdt";
    }
    const meta = [esc(fmtDate(r.date)), ...tags]
      .filter(Boolean)
      .map((x) => `<span>${x}</span>`)
      .join("");
    const acts = editable
      ? `<div class="row-act">${menuHtml(`${NOUN[store]}: ${esc(title)}`, [
          { act: `edit-${store}`, id: r.id, label: "সম্পাদনা", ic: "pencil" },
          { act: `del-${store}`, id: r.id, label: "মুছুন", ic: "trash", del: true }
        ])}</div>`
      : "";
    return `<li class="row"><div class="row-main"><span class="row-title">${esc(title)}</span><span class="row-meta">${meta}</span></div><div class="row-amt ${cls}">${amt}</div>${acts}</li>`;
  }

  const rowsCard = (store, list, editable) => `<section class="card"><ul class="rows">${list.map((r) => recordRow(store, r, editable)).join("")}</ul></section>`;

  const filterSelect = (label, key, options, value) =>
    `<div class="fld"><label for="flt-${key.replace(".", "-")}">${label}</label><select id="flt-${key.replace(".", "-")}" data-filter="${key}">${options
      .map(([v, l]) => `<option value="${esc(v)}"${String(v) === String(value) ? " selected" : ""}>${esc(l)}</option>`)
      .join("")}</select></div>`;

  function yearList(extra) {
    const years = new Set(C.yearsPresent(state));
    years.add(String(nowDate.getFullYear()));
    for (const y of extra) if (y) years.add(String(y));
    return [...years].sort().reverse();
  }

  function listFilters(page, typeConfig, searchLabel) {
    const f = ui[page];
    const years = yearList([f.year]);
    return `<div class="filters" role="group" aria-label="ফিল্টার">
      ${filterSelect("বছর", `${page}.year`, [["", "সব বছর"], ...years.map((y) => [y, y])], f.year)}
      ${filterSelect("মাস", `${page}.month`, [["", "সব মাস"], ...MONTH_NAMES.map((n, i) => [String(i + 1), n])], f.month)}
      ${typeConfig ? filterSelect(typeConfig.label, `${page}.type`, [["", "সব"], ...typeConfig.items], f.type) : ""}
      <div class="fld"><label for="flt-${page}-q">${searchLabel}</label><div class="sbox">${icon("search")}<input id="flt-${page}-q" type="search" data-filter="${page}.query" value="${esc(f.query)}" placeholder="খুঁজুন" autocomplete="off"></div></div>
    </div>`;
  }

  function recentSection() {
    const parts = [
      ["income", "সাম্প্রতিক আয়", "RM"],
      ["expenses", "সাম্প্রতিক খরচ", "RM"],
      ["support", "সাম্প্রতিক পরিবার-সহায়তা", "BDT"]
    ];
    const html = parts
      .map(([store, title, cur]) => {
        const list = C.sortRecords(state[store]).slice(0, 3);
        if (!list.length) return "";
        return secHead(title, cur) + rowsCard(store, list, true);

  const MON = { "জানুয়ারি": "January", "ফেব্রুয়ারি": "February", "মার্চ": "March", "এপ্রিল": "April", "মে": "May", "জুন": "June", "জুলাই": "July", "আগস্ট": "August", "সেপ্টেম্বর": "September", "অক্টোবর": "October", "নভেম্বর": "November", "ডিসেম্বর": "December", "জানু": "Jan", "ফেব্রু": "Feb", "এপ্রি": "Apr", "সেপ্টে": "Sep", "অক্টো": "Oct", "নভে": "Nov", "ডিসে": "Dec" };
  const MON_RE = new RegExp("(^|[\\s\\-–(])(" + Object.keys(MON).sort((a, b) => b.length - a.length).join("|") + ")(?=$|[\\s,.\\-–)])", "g");
  const PATS = [[/(\d[\d,]*)টি রেকর্ড/g, "$1 records"], [/(\d+)টি ট্রান্সফার/g, "$1 transfers"], [/সংরক্ষিত রেকর্ড থেকে হিসাব/g, "calculated from saved records"], [/আমি ধার দিয়েছি/g, "I lent"], [/আমি ধার নিয়েছি/g, "I borrowed"], [/ফেরত: /g, "Due: "], [/ফেরত /g, "Due "], [/রেফ: /g, "Ref: "]];
  const trText = (str) => {
    const t = str.trim();
    if (!t) return str;
    let out = I18N[t];
    if (out === undefined) {
      out = t;
      for (const [re, r] of PATS) out = out.replace(re, r);
      out = out.replace(MON_RE, (m, a, b) => a + MON[b]).replace(/[০-৯]/g, (d) => "০১২৩৪৫৬৭৮৯".indexOf(d));
    }
    return out === t ? str : str.replace(t, () => out);
  };
  const BN_RE = /[\u0980-\u09FF]/;
  function applyLang(root) {
    if (LANG !== "en" || !root) return;
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: (n) => (BN_RE.test(n.nodeValue) && n.parentElement && !n.parentElement.closest("script,style,[data-nolang]") ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_SKIP) });
    const nodes = [];
    while (w.nextNode()) nodes.push(w.currentNode);
    for (const n of nodes) { const v = trText(n.nodeValue); if (v !== n.nodeValue) n.nodeValue = v; }
    root.querySelectorAll("[placeholder],[aria-label],[title],[alt]").forEach((el) => {
      for (const a of ["placeholder", "aria-label", "title", "alt"]) {
        const cur = el.getAttribute(a);
        if (cur && BN_RE.test(cur)) { const v = trText(cur); if (v !== cur) el.setAttribute(a, v); }
      }
    });
  }
  if (LANG === "en") {
    let pend = false;
    const kick = () => { if (pend) return; pend = true; requestAnimationFrame(() => { pend = false; applyLang(document.body); }); };
    new MutationObserver(kick).observe(document.body, { childList: true, subtree: true, characterData: true });

  }
  const THEME = () => lsGet("fin-theme") || "light";

        <div class="seg" role="group" aria-label="Language">${opt("set-lang", "bn", "", "বাংলা", LANG === "bn")}${opt("set-lang", "en", "", "English", LANG === "en")}</div></div>
      <div class="pref"><div class="pref-h"><span class="ico">${icon(document.documentElement.dataset.theme === "dark" ? "moon" : "sun")}</span><div><b>থিম / Theme</b><small>আলো, অন্ধকার, অথবা ফোনের সেটিং অনুযায়ী</small></div></div>
        <div class="seg" role="group" aria-label="Theme">${opt("set-theme", "light", "sun", "লাইট", THEME() === "light")}${opt("set-theme", "dark", "moon", "ডার্ক", THEME() === "dark")}${opt("set-theme", "system", "monitor", "সিস্টেম", THEME() === "system")}</div></div>

  /* ---------- three-dot menu (shared) ---------- */
  function menuHtml(label, items) {
    return `<div class="menu"><button type="button" class="icon-btn" data-menu aria-haspopup="menu" aria-expanded="false" aria-label="অ্যাকশন: ${label}">${icon("more")}</button><div class="menu-pop" role="menu" hidden>${items
      .map((i) => `<button type="button" role="menuitem"${i.del ? ' class="del"' : ""} data-act="${i.act}" data-id="${esc(i.id)}">${icon(i.ic)}<span>${i.label}</span></button>`)

  }
  function closeMenus() {
    document.querySelectorAll(".menu-pop:not([hidden])").forEach((m) => {
      m.hidden = true;
      const b = m.previousElementSibling;
      if (b) b.setAttribute("aria-expanded", "false");
    });
  }
  document.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-menu]");
    const wasOpen = btn && !btn.nextElementSibling.hidden;
    closeMenus();
    if (!btn || wasOpen) return;
    const pop = btn.nextElementSibling;
    pop.hidden = false;
    btn.setAttribute("aria-expanded", "true");
    const r = btn.getBoundingClientRect();
    const h = pop.offsetHeight;
    pop.style.right = Math.max(8, window.innerWidth - r.right) + "px";
    pop.style.top = (r.bottom + h + 8 > window.innerHeight ? Math.max(8, r.top - h - 4) : r.bottom + 4) + "px";

  window.addEventListener("scroll", closeMenus, true);
  window.addEventListener("resize", closeMenus);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeMenus(); });

  /* ---------- Loans & Debt (self-contained; uses the "loans" Appwrite table) ---------- */
  const LOAN_COLS = ["direction", "person", "currency", "amountMinor", "date", "dueDate", "note", "repayments"];
  const ui_loans = { tab: "lent", query: "", status: "", from: "", to: "" };
  const loanMoney = (cur, minor) => (minor / 100).toLocaleString("en-US", { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  function parseMinor(str) {
    const t = String(str || "").replace(/[,\s]/g, "");
    if (!/^\d{1,12}(\.\d{1,2})?$/.test(t)) return null;
    const [a, b = ""] = t.split(".");
    const n = Number(a) * 100 + Number((b + "00").slice(0, 2));
    return n > 0 ? n : null;
  }
  function loanFromRow(row) {
    let reps = [];
    try { const x = JSON.parse(row.repayments || "[]"); if (Array.isArray(x)) reps = x.filter((q) => q && Number.isInteger(q.amountMinor) && q.amountMinor > 0); } catch (err) { reps = []; }
    return {
      id: row.$id,
      direction: row.direction === "borrowed" ? "borrowed" : "lent",
      person: String(row.person || "").trim(),
      currency: row.currency === "BDT" ? "BDT" : "RM",
      amountMinor: Number(row.amountMinor) || 0,
      date: String(row.date || "").trim(),
      dueDate: String(row.dueDate || "").trim(),
      note: String(row.note || "").trim(),
      repayments: reps,
      createdAt: Date.parse(row.$createdAt) || 0
    };
  }
  const loanPaid = (l) => l.repayments.reduce((t, q) => t + q.amountMinor, 0);
  const loanRemain = (l) => Math.max(0, l.amountMinor - loanPaid(l));
  const loanOverdue = (l) => loanRemain(l) > 0 && !!l.dueDate && l.dueDate < today();
  const loanStatus = (l) => (loanRemain(l) === 0 ? "done" : loanOverdue(l) ? "late" : "open");
  function loanTotals(dir) {
    return state.loans.filter((l) => l.direction === dir).reduce((t, l) => t + loanRemain(l), 0);
  }
  async function loadLoans() {
    try {
      const rows = await cloud.listAll("loans");
      state.loans = rows.map(loanFromRow);
      state.loansStatus = "ok";
    } catch (err) {
      state.loans = [];
      state.loansStatus = err && err.status === 404 ? "missing" : "error";
    }
  }
  const loanWrite = (l, isUpdate) => {
    const data = { direction: l.direction, person: l.person, currency: "-", amountMinor: l.amountMinor, date: l.date, repayments: JSON.stringify(l.repayments) };
    for (const f of ["dueDate", "note"]) { if (l[f]) data[f] = l[f]; else if (isUpdate) data[f] = ""; }
    const send = (d) => (isUpdate ? cloud.updateRow("loans", l.id, d) : cloud.createRow("loans", l.id, d, state.user.id));
    return send(data).catch((err) => {
      if (err && /Unknown attribute: "?currency/i.test(String(err.message || ""))) { const d = { ...data }; delete d.currency; return send(d); }
      throw err;
    });
  };
  async function saveLoan(l, isUpdate) {
    try {
      await loanWrite(l, isUpdate);
    } catch (err) {
      if (err && /Unknown attribute/i.test(String(err.message || ""))) throw new ApiError("Appwrite-এর loans টেবিলে প্রয়োজনীয় কলাম নেই। Columns ট্যাবে সব কলাম যোগ করুন।", 400, "unknown_column");
      throw err;
    }
    const i = state.loans.findIndex((x) => x.id === l.id);
    if (i >= 0) state.loans[i] = l; else state.loans.push(l);
  }

  function loanForm(existing) {
    const v = existing || { direction: ui_loans.tab, person: "", currency: "RM", amountMinor: 0, date: today(), dueDate: "", note: "", repayments: [] };
    const names = new Set();
    for (const x of state.loans) names.add(x.person);

      title: existing ? "ঋণ সম্পাদনা" : "ঋণ / পাওনা যোগ করুন",
      body: `${selectField({ name: "direction", label: "ধরন", options: [["lent", "আমি ধার দিয়েছি (আমাকে দেবে)"], ["borrowed", "আমি ধার নিয়েছি (আমি দেব)"]], value: v.direction, required: true })}
        ${inputField({ name: "person", label: "ব্যক্তির নাম", value: v.person, required: true, list: "loan-names", attrs: 'maxlength="60" autocomplete="off"' })}
        <datalist id="loan-names">${[...names].map((n) => `<option value="${esc(n)}"></option>`).join("")}</datalist>
        <div class="fld"><label for="f-amount">টাকার অংক <span class="req" aria-hidden="true">*</span></label><input id="f-amount" name="amount" type="text" inputmode="decimal" autocomplete="off" placeholder="0" value="${esc(existing ? C.minorToDecimal(v.amountMinor) : "")}" required></div>
        <div class="two">${inputField({ name: "date", label: "তারিখ", type: "date", value: v.date, required: true })}${inputField({ name: "dueDate", label: "ফেরতের তারিখ (ঐচ্ছিক)", type: "date", value: v.dueDate })}</div>
        ${inputField({ name: "note", label: "নোট (ঐচ্ছিক)", value: v.note, attrs: 'maxlength="200"' })}`,
      onSubmit: async (raw) => {
        const errors = {};

        if (!person) errors.person = "নাম লিখুন।";
        const amountMinor = parseMinor(raw.amount);
        if (!amountMinor) errors.amount = "সঠিক পরিমাণ লিখুন (যেমন 500 বা 500.50)।";
        else if (existing && amountMinor < loanPaid(existing)) errors.amount = "এতে ইতিমধ্যে পরিশোধিত পরিমাণের চেয়ে কম হতে পারে না।";
        if (!/^\d{4}-\d{2}-\d{2}$/.test(raw.date || "")) errors.date = "তারিখ দিন।";

        if (Object.keys(errors).length) return { errors };
        const l = { id: existing ? existing.id : newId(), direction: raw.direction === "borrowed" ? "borrowed" : "lent", person, currency: "", amountMinor, date: raw.date, dueDate: raw.dueDate || "", note: String(raw.note || "").trim(), repayments: existing ? existing.repayments : [] };
        try { await saveLoan(l, !!existing); } catch (err) { return { errors: { _form: failMessage(err) } }; }
        ui_loans.tab = l.direction;
        render();
        toast(existing ? "আপডেট হয়েছে" : "সংরক্ষিত হয়েছে");
        return null;
      }
    });
  }

  function repayForm(l) {

      title: l.direction === "lent" ? "পরিশোধ পেয়েছি" : "পরিশোধ করেছি",

  function loanView(l) {

  function loanDashboardSection() {
    return `<div class="no-print"><div class="sec-head"><h2>ঋণ ও পাওনা</h2><a class="chip rm" href="#/loans">বিস্তারিত</a></div><div class="tiles two">${tile("আমাকে দেবে", loanMoney("", loanTotals("lent")), { cls: "loan-in" })}${tile("আমি দেব", loanMoney("", loanTotals("borrowed")), { cls: "loan-out" })}</div></div>`;
  }

  function renderDashboard() {
    const key = thisMonth();
    const prevKey = C.shiftMonth(key, -1);
    const cur = C.monthSummary(state, key, state.completion);
    const prev = C.monthSummary(state, prevKey, state.completion);
    const life = C.lifetimeSummary(state);
    const cmp = C.compareAmounts(prev.supportMinor, cur.supportMinor);
    const pctValue = cmp.percentAvailable ? `${cmp.status === "up" ? "+" : cmp.status === "down" ? "-" : ""}${cmp.percent}%` : "—";
    const pctSub = cmp.percentAvailable ? "আগের মাসের তুলনায়" : cmp.zeroBaseline ? "আগের মাস শূন্য, শতাংশ হিসাব হয় না" : "";
    const incompleteMonths = [prev, cur].filter((m) => !m.supportComplete).map((m) => monthLabel(m.month));
    const legacyBanner = state.legacy
      ? `<div class="banner warn">${icon("alert")}<span>এই ব্রাউজারে আগের ভার্সনের ${state.legacy.count}টি লোকাল রেকর্ড আছে। <a href="#/settings">Settings</a> থেকে ক্লাউডে তুলুন।</span></div>`
      : "";
    const onboarding =
      life.recordCount === 0
        ? `<section class="card">${emptyBox("wallet", "এখনো কোনো রেকর্ড নেই", "প্রথম রেকর্ড যোগ করে শুরু করুন। অ্যাপে কোনো নমুনা ডেটা রাখা হয়নি।")}<div class="actions center"><button type="button" class="btn primary" data-act="add-income">${icon("plus")} প্রথম আয় যোগ করুন</button><button type="button" class="btn" data-act="add-expenses">${icon("plus")} খরচ</button><button type="button" class="btn" data-act="add-support">${icon("plus")} পরিবারকে পাঠানো</button></div></section>`
        : "";
    return `
    <div class="page-head"><div><h1>Dashboard</h1><p>${monthLabel(key)} · সংরক্ষিত রেকর্ড থেকে হিসাব</p></div>
      <div class="actions"><button type="button" class="btn primary" data-act="add-income">${icon("plus")} আয়</button><button type="button" class="btn" data-act="add-expenses">${icon("plus")} খরচ</button><button type="button" class="btn" data-act="add-support">${icon("plus")} পরিবারকে পাঠানো</button></div></div>
    ${legacyBanner}
    ${onboarding}
    ${secHead("Malaysian Finance", "RM")}
    <div class="tiles">
      ${tile("এই মাসের আয়", rm(cur.incomeMinor), { cls: "rm", sub: `${cur.incomeCount}টি রেকর্ড` })}
      ${tile("এই মাসের ব্যক্তিগত খরচ", rm(cur.expenseMinor), { cls: "rm", sub: `${cur.expenseCount}টি রেকর্ড` })}
      ${tile("এই মাসের অবশিষ্ট", rm(cur.balanceMinor), { cls: "rm", neg: cur.balanceMinor < 0 })}
      ${tile("মোট আয় (আজীবন)", rm(life.incomeMinor), { cls: "rm" })}
      ${tile("মোট খরচ (আজীবন)", rm(life.expenseMinor), { cls: "rm" })}
      ${tile("বর্তমান ব্যালান্স", rm(life.balanceMinor), { cls: "rm strong", neg: life.balanceMinor < 0, sub: "মোট আয় − মোট ব্যক্তিগত খরচ" })}
    </div>
    <p class="cmp-note">BDT পরিবার-সহায়তা এই RM ব্যালান্সে ধরা হয় না।</p>
    ${loanDashboardSection()}
    ${secHead("Bangladesh Family Support", "BDT")}
    <div class="tiles">
      ${tile("এই মাসে পাঠানো", bdt(cur.supportMinor), { cls: "bdt", sub: monthLabel(key) })}
      ${tile("গত মাসে পাঠানো", bdt(prev.supportMinor), { cls: "bdt", sub: monthLabel(prevKey) })}
      ${tile("পার্থক্য", C.formatSignedBDT(cmp.diffMinor), { cls: "bdt", sub: statusBadge(cmp) })}
      ${tile("শতাংশ পরিবর্তন", pctValue, { cls: "bdt", sub: pctSub })}
      ${tile("আজীবন মোট পাঠানো", bdt(life.supportMinor), { cls: "bdt strong" })}
      ${tile("মোট ট্রান্সফার", String(life.supportCount), { cls: "bdt", sub: "রেকর্ড করা সংখ্যা" })}
    </div>
    ${incompleteMonths.length ? `<div class="banner warn">${icon("alert")}<span>${incompleteMonths.join(" ও ")} মাসের পরিবার-সহায়তার রেকর্ড সম্পূর্ণ হিসেবে চিহ্নিত নয়। তুলনা অসম্পূর্ণ হতে পারে। <a href="#/monthly">Monthly Reports</a> থেকে চিহ্নিত করুন।</span></div>` : ""}
    ${recentSection()}`;
  }

  function incomeRegion() {
    const f = ui.income;
    const list = C.sortRecords(C.filterRecords(state.income, { year: f.year, month: f.month, field: "type", value: f.type, query: f.query, searchFields: ["note", "reference"] }));
    const life = C.lifetimeSummary(state);
    const body =
      state.income.length === 0
        ? `<section class="card">${emptyBox("trend-up", "No income recorded yet", "আয়ের প্রথম রেকর্ড যোগ করুন।", "add-income", "আয় যোগ করুন")}</section>`
        : list.length === 0
          ? `<section class="card">${emptyBox("search", "এই ফিল্টারে কোনো আয় নেই", "")}</section>`

    return `<div class="tiles">
      ${tile("ফিল্টার অনুযায়ী মোট আয়", rm(C.sum(list)), { cls: "rm", sub: `${list.length}টি রেকর্ড` })}
      ${tile("আজীবন মোট আয়", rm(life.incomeMinor), { cls: "rm strong", sub: `${life.incomeCount}টি রেকর্ড` })}
    </div>${body}`;

    return `<div class="page-head"><div><h1>Income</h1><p>শুধু মালয়েশিয়ান রিঙ্গিত (RM)</p></div><div class="actions"><button type="button" class="btn primary" data-act="add-income">${icon("plus")} আয় যোগ করুন</button></div></div>

  }

  function expensesRegion() {
    const f = ui.expenses;
    const list = C.sortRecords(C.filterRecords(state.expenses, { year: f.year, month: f.month, field: "category", value: f.type, query: f.query, searchFields: ["description", "note"] }));
    const life = C.lifetimeSummary(state);
    const byCat = C.sumByKey(list, "category");
    const entries = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
    const top = entries.length ? entries[0][1] : 1;
    const chart = entries.length
      ? `<section class="card"><h3>ক্যাটাগরি অনুযায়ী খরচ</h3><ul class="hbars">${entries
          .map(([k, v]) => `<li><span class="name">${esc(LABELS.expense[k])}</span><span class="amt">${rm(v)}</span><span class="track"><i style="width:${Math.max(2, Math.round((v / top) * 100))}%"></i></span></li>`)
          .join("")}</ul></section>`
      : "";
    const body =
      state.expenses.length === 0
        ? `<section class="card">${emptyBox("receipt", "No expenses recorded yet", "প্রথম খরচের রেকর্ড যোগ করুন।", "add-expenses", "খরচ যোগ করুন")}</section>`
        : list.length === 0
          ? `<section class="card">${emptyBox("search", "এই ফিল্টারে কোনো খরচ নেই", "")}</section>`
          : rowsCard("expenses", list, true);
    return `<div class="tiles">
      ${tile("ফিল্টার অনুযায়ী মোট খরচ", rm(C.sum(list)), { cls: "rm", sub: `${list.length}টি রেকর্ড` })}
      ${tile("আজীবন মোট খরচ", rm(life.expenseMinor), { cls: "rm strong", sub: `${life.expenseCount}টি রেকর্ড` })}
    </div>${chart}${body}`;
  }

  function renderExpenses() {
    return `<div class="page-head"><div><h1>Expenses</h1><p>ব্যক্তিগত খরচ · শুধু RM</p></div><div class="actions"><button type="button" class="btn primary" data-act="add-expenses">${icon("plus")} খরচ যোগ করুন</button></div></div>
    ${listFilters("expenses", { label: "ক্যাটাগরি", items: Object.entries(LABELS.expense) }, "বিবরণ / নোট")}

  }

    const f = ui.support;
    const list = C.sortRecords(C.filterRecords(state.support, { year: f.year, month: f.month, query: f.query, searchFields: ["recipient"] }));
    const life = C.lifetimeSummary(state);

    const extra = key
      ? comparisonCard(key)
      : `<p class="cmp-note">মাসের তুলনা ও "সম্পূর্ণ" চিহ্ন দেখতে বছর ও মাস দুটোই বাছুন, অথবা <a href="#/monthly">Monthly Reports</a>-এ যান।</p>`;
    const body =
      state.support.length === 0
        ? `<section class="card">${emptyBox("users", "No family support recorded yet", "পরিবারকে পাঠানো প্রথম টাকার রেকর্ড যোগ করুন।", "add-support", "ট্রান্সফার যোগ করুন")}</section>`
        : list.length === 0
          ? `<section class="card">${emptyBox("search", "এই ফিল্টারে কোনো ট্রান্সফার নেই", "")}</section>`
          : rowsCard("support", list, true);
    return `<div class="tiles">
      ${tile("ফিল্টার অনুযায়ী মোট পাঠানো", bdt(C.sum(list)), { cls: "bdt", sub: `${list.length}টি ট্রান্সফার` })}
      ${tile("আজীবন মোট পাঠানো", bdt(life.supportMinor), { cls: "bdt strong", sub: `${life.supportCount}টি ট্রান্সফার` })}
    </div>${extra}${body}`;
  }

    const f = ui.support;
    const years = yearList([f.year]);
    return `<div class="page-head"><div><h1>Family Support</h1><p>বাংলাদেশে পরিবারকে পাঠানো · শুধু BDT · হাতে লেখা পরিমাণ</p></div><div class="actions"><button type="button" class="btn primary" data-act="add-support">${icon("plus")} ট্রান্সফার যোগ করুন</button></div></div>

      <div class="fld"><label for="flt-support-q">প্রাপক</label><div class="sbox">${icon("search")}<input id="flt-support-q" type="search" data-filter="support.query" value="${esc(f.query)}" placeholder="খুঁজুন" autocomplete="off"></div></div>

      ${filterSelect("মাস", "monthly.m", MONTH_NAMES.map((n, i) => [String(i + 1), n]), ui.monthly.m)}

  function monthListSection(title, store, list) {
    if (!list.length) return `<section class="card"><h3>${title}</h3><p class="cmp-note">এই মাসে কোনো রেকর্ড নেই।</p></section>`;

      .map((r) => recordRow(store, r, false))

  function renderMonthly() {
    const key = monthlyKey();
    const s = C.monthSummary(state, key, state.completion);
    const keys = [-5, -4, -3, -2, -1, 0].map((d) => C.shiftMonth(key, d));
    const values = keys.map((k) => C.monthSummary(state, k, state.completion).supportMinor);
    const labels = keys.map((k) => `${MONTH_SHORT[Number(k.slice(5)) - 1]} ${k.slice(2, 4)}`);
    const inMonth = (list) => list.filter((r) => C.monthKey(r.date) === key);
    return `<div class="page-head"><div><h1>Monthly Reports</h1><p>${monthLabel(key)}</p></div></div>
    ${monthPicker()}
    ${secHead("Malaysian Finance", "RM")}
    <div class="tiles">
      ${tile("মোট আয়", rm(s.incomeMinor), { cls: "rm", sub: `${s.incomeCount}টি রেকর্ড` })}
      ${tile("মোট ব্যক্তিগত খরচ", rm(s.expenseMinor), { cls: "rm", sub: `${s.expenseCount}টি রেকর্ড` })}
      ${tile("অবশিষ্ট", rm(s.balanceMinor), { cls: "rm strong", neg: s.balanceMinor < 0 })}
    </div>
    ${secHead("Bangladesh Family Support", "BDT")}
    <div class="tiles">
      ${tile("মোট পাঠানো", bdt(s.supportMinor), { cls: "bdt strong" })}
      ${tile("ট্রান্সফার সংখ্যা", String(s.supportCount), { cls: "bdt" })}
    </div>
    ${comparisonCard(key)}
    <section class="card"><h3>মাস-ভিত্তিক পরিবার-সহায়তা (BDT)</h3>${vchart({ labels, series: [{ name: "BDT", cls: "bdt", values }], format: bdt, selected: 5, showValues: true, label: "শেষ ৬ মাসে পাঠানো টাকা" })}</section>
    ${monthListSection(`Family Support ট্রান্সফার — ${bdt(s.supportMinor)}`, "support", inMonth(state.support))}
    ${monthListSection(`আয় — ${rm(s.incomeMinor)}`, "income", inMonth(state.income))}
    ${monthListSection(`ব্যক্তিগত খরচ — ${rm(s.expenseMinor)}`, "expenses", inMonth(state.expenses))}`;
  }

  function renderYearly() {
    const year = ui.yearly.year;
    const y = C.yearSummary(state, year, state.completion);
    const years = yearList([year]);

  function restoreView() {

    if (r.errors) {
      return `<div class="banner err">${icon("alert")}<div><b>${esc(r.fileName || "ফাইল")} ইমপোর্ট করা যাবে না</b><ul class="notes">${r.errors.map((e) => `<li>${esc(e)}</li>`).join("")}</ul>${r.errorCount > r.errors.length ? `<p>আরও ${r.errorCount - r.errors.length}টি ত্রুটি আছে।</p>` : ""}<p>আপনার বর্তমান ডেটা অপরিবর্তিত আছে।</p></div></div><div class="actions" style="margin-top:12px"><button type="button" class="btn sm" data-act="cancel-restore">বন্ধ করুন</button></div>`;
    }
    const { plan, backup } = r;
    const labels = { income: "আয় (RM)", expenses: "খরচ (RM)", support: "পরিবার (BDT)" };
    const table = STORES.map((s) => `<tr><td>${labels[s]}</td><td>${backup.data[s].length}</td><td>${plan.add[s].length}</td></tr>`).join("");
    const addTotal = STORES.reduce((t, s) => t + plan.add[s].length, 0) + plan.completionToSet.length;
    const nothing = addTotal === 0;
    return `<div class="banner info">${icon("info")}<span><b>${esc(r.fileName)}</b> · তৈরি: ${esc(new Date(backup.createdAt).toLocaleString("bn-BD"))}</span></div>

  const b64enc = (buf) => { let s = ""; const u = new Uint8Array(buf); for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
  const b64dec = (str) => Uint8Array.from(atob(str), (c) => c.charCodeAt(0));
  async function deriveKey(pass, salt, iter) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
  }
  async function encryptBackup(text, pass) {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const iter = 250000;
    const key = await deriveKey(pass, salt, iter);
    const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(text));
    return JSON.stringify({ app: "personal-finance-tracker", encrypted: true, cipher: "AES-GCM-256", kdf: "PBKDF2-SHA256", iterations: iter, salt: b64enc(salt), iv: b64enc(iv), data: b64enc(ct) });
  }
  async function decryptBackup(obj, pass) {
    const key = await deriveKey(pass, b64dec(obj.salt), obj.iterations);
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64dec(obj.iv) }, key, b64dec(obj.data));
    return JSON.parse(new TextDecoder().decode(pt));
  }

  async function saveRecord(store, existing, value) {
    if (existing) {
      const row = await writeRow(store, existing.id, { ...existing, ...value }, true);
      const rec = fromRow(store, row);
      const i = state[store].findIndex((x) => x.id === rec.id);
      if (i >= 0) state[store][i] = rec;
      else state[store].push(rec);
      return rec;
    }
    const row = await writeRow(store, newId(), value, false);
    const rec = fromRow(store, row);
    state[store].push(rec);
    return rec;
  }

  const toHex = (buf) => Array.from(new Uint8Array(buf), (x) => x.toString(16).padStart(2, "0")).join("");
  async function verifyBackupPass(pass) {
    try {
      const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveBits"]);
      const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt: b64dec(BACKUP_GATE.salt), iterations: BACKUP_GATE.iter, hash: "SHA-256" }, base, 256);
      return toHex(bits) === BACKUP_GATE.hash;
    } catch (err) { return false; }
  }

        toast("পাসওয়ার্ড ভুল।");
        return null;
      })();
    }
    return new Promise((resolve) => {

  async function handleRestoreFile(file) {
    if (!file) return;
    if (file.size > 50 * 1024 * 1024) {
      ui.restore = { fileName: file.name, errors: ["ফাইলটি অতিরিক্ত বড় (৫০ MB-এর বেশি)।"], errorCount: 1 };
      refreshRestore();
      return;
    }
    let parsed;
    try {
      parsed = JSON.parse(await file.text());
    } catch (err) {
      ui.restore = { fileName: file.name, errors: ["ফাইলটি পড়া যায়নি। এটি বৈধ JSON নয়।"], errorCount: 1 };
      refreshRestore();
      return;
    }
    if (parsed && parsed.encrypted === true) {
      const pass = window.prompt("এই ব্যাকআপ এনক্রিপ্টেড। পাসওয়ার্ড দিন:");
      if (!pass) { ui.restore = { fileName: file.name, errors: ["পাসওয়ার্ড দেওয়া হয়নি।"], errorCount: 1 }; refreshRestore(); return; }
      try { parsed = await decryptBackup(parsed, pass); }
      catch (err) { ui.restore = { fileName: file.name, errors: ["পাসওয়ার্ড ভুল অথবা ফাইল নষ্ট।"], errorCount: 1 }; refreshRestore(); return; }
    }
    const v = C.validateBackup(parsed);
    if (!v.ok) ui.restore = { fileName: file.name, errors: v.errors, errorCount: v.errorCount };
    else ui.restore = { fileName: file.name, backup: v, plan: C.planImport(state, state.completion, v, "merge") };
    refreshRestore();
  }

  async function createImported(task) {
    if (task.table === "completion") return cloud.createRow("completion", newId(), { month: task.month }, state.user.id);
    try {
      return await writeRow(task.table, task.rec.id, task.rec, false);
    } catch (err) {
      if (err.status !== 409) throw err;
      return writeRow(task.table, newId(), task.rec, false);
    }
  }

  async function runImport() {
    const r = ui.restore;
    if (!r || !r.plan || ui.importing) return;
    const tasks = [];
    for (const s of STORES) for (const rec of r.plan.add[s]) tasks.push({ table: s, rec });
    for (const month of r.plan.completionToSet) tasks.push({ table: "completion", month });
    if (!tasks.length) return;
    ui.importing = true;
    let added = 0;
    let failed = 0;
    let lastError = null;
    for (const task of tasks) {
      try {
        await createImported(task);
        added++;
      } catch (err) {
        failed++;
        lastError = err;
        if (err.status === 401 || err.status === 0) break;
      }
      if ((added + failed) % 5 === 0) toast(`ইমপোর্ট চলছে… ${added + failed}/${tasks.length}`);
    }
    ui.importing = false;
    try {
      await reloadState();
    } catch (err) {
      state.loadError = err;
    }
    const skipped = tasks.length - added - failed;
    if (failed || skipped) {
      ui.restore = null;
      render();
      toast(`আংশিক ইমপোর্ট: ${added}টি যোগ হয়েছে, ${failed + skipped}টি হয়নি (${errorMessage(lastError)})। একই ফাইল আবার ইমপোর্ট করলে শুধু বাকিগুলো যোগ হবে।`);
      return;
    }
    ui.restore = null;
    render();
    toast(`ইমপোর্ট সম্পন্ন: ${added}টি রেকর্ড যোগ হয়েছে`);
  }
