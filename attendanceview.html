<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#173B63">
<title>Shared Attendance | WorkTrack</title>
<link rel="icon" href="/bdflag.webp" type="image/webp">
<style>
:root{
  --navy:#173B63; --navy2:#0F2C4D; --ink:#172033; --muted:#667085; --line:#E4E8EE; --soft:#EEF1F4;
  --bg:#F2F5F9; --card:#fff; --ok:#0F766A; --okbg:rgba(21,154,134,.12); --lv:#9C6B0F; --lvbg:rgba(217,154,36,.16);
  --danger:#C0392B;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali","Hind Siliguri","Noto Sans",Arial,sans-serif;
}
*{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); font-size:16px; line-height:1.45;
  min-height:100vh; display:flex; flex-direction:column; padding-bottom:env(safe-area-inset-bottom,0);
}
button,select,textarea,input{ font-family:inherit; font-size:1rem; }
.bar{
  background:linear-gradient(135deg,var(--navy2),var(--navy)); color:#fff;
  padding:calc(14px + env(safe-area-inset-top,0)) 16px 14px;
  display:flex; align-items:center; justify-content:space-between; gap:10px; box-shadow:0 2px 10px rgba(15,44,77,.25);
}
.brandrow{ display:flex; align-items:center; gap:11px; min-width:0; }
a.brandrow{text-decoration:none;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
a.brandrow:active{opacity:.85}

.mark{ height:40px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:1.5rem; color:#fff; flex-shrink:0; }
.mark img{ height:34px; width:auto; max-width:46vw; display:block; object-fit:contain; }
.byline{ display:inline-flex; align-items:center; gap:8px; margin-bottom:6px; font-weight:700; color:#475467; }
.byline img{ width:26px; height:26px; border-radius:50%; object-fit:cover; border:1.5px solid #fff; box-shadow:0 1px 4px rgba(16,24,40,.25); }
.brand{ font-weight:800; letter-spacing:.04em; font-size:1.05rem; line-height:1.15; }
.brand small{ display:block; font-weight:500; font-size:.7rem; opacity:.78; letter-spacing:.03em; margin-top:2px; }
.chip{ background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.22); border-radius:999px; padding:5px 12px; font-size:.76rem; font-weight:700; white-space:nowrap; display:inline-flex; align-items:center; gap:6px; }
.chip svg{ width:14px; height:14px; }
main{ width:100%; max-width:760px; margin:0 auto; padding:16px 14px 20px; flex:1; display:flex; flex-direction:column; gap:12px; }
.card{
  background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px 16px;
  box-shadow:0 1px 2px rgba(16,24,40,.04),0 6px 18px rgba(16,24,40,.05);
}
.hero{ border-top:4px solid var(--navy); }
.herotop{ display:flex; align-items:center; gap:14px; }
.avatar{ width:54px; height:54px; border-radius:50%; background:linear-gradient(135deg,#2563A8,var(--navy)); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:1.5rem; flex-shrink:0; box-shadow:0 4px 10px rgba(23,59,99,.3); }
.eyebrow{ font-size:.7rem; font-weight:800; letter-spacing:.12em; color:var(--ok); text-transform:uppercase; margin:0 0 2px; }
h1{ margin:0; font-size:1.5rem; line-height:1.2; color:var(--navy); overflow-wrap:anywhere; }
.sub{ margin:4px 0 0; color:var(--muted); font-size:.8rem; display:flex; align-items:center; gap:6px; }
.sub::before{ content:""; width:7px; height:7px; border-radius:50%; background:#22C55E; box-shadow:0 0 0 3px rgba(34,197,94,.18); }
label.fl{ display:block; margin:16px 0 6px; font-size:.74rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
select,textarea{
  width:100%; border:1.5px solid #CBD5E1; border-radius:12px; background:#fff; color:var(--ink);
  padding:12px 12px; min-height:48px;
}
select:focus,textarea:focus{ outline:none; border-color:var(--navy); box-shadow:0 0 0 3px rgba(23,59,99,.12); }
.tiles{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.tile{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:12px 8px 11px; text-align:center; min-width:0; position:relative; overflow:hidden; box-shadow:0 1px 2px rgba(16,24,40,.04); }
.tile::before{ content:""; position:absolute; left:0; right:0; top:0; height:3px; background:var(--navy); }
.tile.t-ok::before{ background:#16A085; } .tile.t-lv::before{ background:#E0A32E; }
.tile b{ display:block; font-size:1.55rem; line-height:1.15; color:var(--navy); }
.tile span{ font-size:.7rem; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
.rate{ margin-top:2px; }
.ratehead{ display:flex; justify-content:space-between; align-items:baseline; font-size:.8rem; font-weight:700; color:var(--muted); }
.ratehead b{ color:var(--navy); font-size:.95rem; }
.bar2{ height:8px; border-radius:8px; background:var(--soft); overflow:hidden; margin:8px 0 6px; }
.bar2 i{ display:block; height:100%; border-radius:8px; background:linear-gradient(90deg,#16A085,#22C55E); }
.ratefoot{ font-size:.75rem; color:var(--muted); }
.earn{ border-top:4px solid var(--ok); }
.earnhead{ display:flex; align-items:center; gap:12px; margin-bottom:14px; }
.earn-ic{ width:40px; height:40px; border-radius:12px; background:var(--okbg); color:var(--ok); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.earn-ic svg{ width:22px; height:22px; }
.earnhead h3{ margin:0; font-size:1.05rem; color:var(--navy); }
.earnhead p{ margin:2px 0 0; font-size:.78rem; color:var(--muted); }
.earn-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
.earn-grid > div{ background:#F6F8FA; border:1px solid var(--line); border-radius:14px; padding:12px; min-width:0; }
.earn-grid > div.take{ background:linear-gradient(135deg,#0F766A,#14917F); border-color:#0F766A; color:#fff; }
.earn-grid span{ display:block; font-size:.66rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; opacity:.78; }
.earn-grid b{ display:block; font-size:1.22rem; margin:4px 0 2px; color:inherit; overflow-wrap:anywhere; }
.earn-grid > div:not(.take) b{ color:var(--navy); }
.earn-grid small{ font-size:.72rem; opacity:.78; }
.earn-note{ margin:0 0 12px; font-size:.74rem; color:var(--muted); }
.earn-btn{ width:100%; flex:none; }
.actions{ display:flex; flex-wrap:wrap; gap:10px; }
.btn{
  flex:1 1 150px; min-height:50px; border-radius:13px; border:1.5px solid var(--navy); background:var(--navy); color:#fff;
  font-weight:700; display:inline-flex; align-items:center; justify-content:center; gap:8px; cursor:pointer; padding:0 14px;
  box-shadow:0 3px 8px rgba(23,59,99,.22);
}
.btn.sec{ background:#fff; color:var(--navy); box-shadow:none; }
.btn:active{ transform:translateY(1px); }
.btn:disabled{ opacity:.6; cursor:default; }
.btn svg{ width:18px; height:18px; flex-shrink:0; }
.lhead{ display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
.lhead h3{ margin:0; font-size:.95rem; color:var(--navy); letter-spacing:.01em; }
.lhead span{ font-size:.76rem; font-weight:700; color:var(--muted); background:var(--soft); border-radius:999px; padding:3px 10px; }
.list{ list-style:none; margin:0; padding:0; }
.row{
  display:grid; grid-template-columns:46px 1fr auto 42px 40px; align-items:center; gap:10px;
  padding:10px 0; border-bottom:1px solid var(--soft);
}
.row:last-child{ border-bottom:none; }
.dt{ width:46px; height:50px; border-radius:12px; background:#F3F6F9; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.1; }
.dt b{ font-size:1.15rem; color:var(--navy); }
.dt span{ font-size:.64rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
.row.is-leave .dt{ background:var(--lvbg); }
.d b{ display:block; font-size:.98rem; }
.d small{ color:var(--muted); font-size:.76rem; }
.badge{ padding:3px 11px; border-radius:999px; font-size:.74rem; font-weight:700; }
.badge.duty{ background:var(--okbg); color:var(--ok); }
.badge.leave{ background:var(--lvbg); color:var(--lv); }
.h{ min-width:42px; text-align:right; font-weight:800; color:var(--navy); }
.h.off{ color:#98A2B3; font-weight:600; }
.flag{
  width:40px; height:40px; border-radius:11px; border:1px solid var(--line); background:#fff; color:#667085;
  display:inline-flex; align-items:center; justify-content:center; cursor:pointer; padding:0;
}
.flag:active{ background:var(--soft); }
.flag svg{ width:18px; height:18px; }
@media (max-width:370px){ .row{ grid-template-columns:44px 1fr auto 38px; } .flag{ display:none; } }
.empty,.msg{ color:var(--muted); text-align:center; padding:22px 8px; }
.state{ text-align:center; padding:30px 12px 24px; }
.state h2{ margin:14px 0 6px; color:var(--navy); font-size:1.35rem; }
.state p{ margin:0 auto; max-width:420px; color:var(--muted); }
.state .ico{ width:64px; height:64px; margin:0 auto; border-radius:50%; background:#FDECEA; color:var(--danger); display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 8px rgba(192,57,43,.07); }
.state .ico svg{ width:30px; height:30px; }
.state .ico.ok{ background:var(--okbg); color:var(--ok); box-shadow:0 0 0 8px rgba(21,154,134,.08); }
.state .help{ margin-top:18px; font-size:.84rem; }
.state .help a.btn{ display:inline-flex; flex:0 1 auto; margin-top:10px; text-decoration:none; color:var(--navy); background:#fff; box-shadow:none; }
footer{ text-align:center; color:var(--muted); font-size:.78rem; padding:6px 14px 22px; }
footer .sec{ display:inline-flex; align-items:center; gap:6px; font-weight:700; color:#475467; margin-bottom:4px; }
footer .sec svg{ width:14px; height:14px; }
footer a, .state a{ color:var(--navy); font-weight:700; }
.ov{ position:fixed; inset:0; background:rgba(16,24,40,.55); display:flex; align-items:flex-end; justify-content:center; z-index:50; }
.sheet{
  background:#fff; width:100%; max-width:480px; max-height:94vh; overflow-y:auto; border-radius:18px 18px 0 0;
  padding:18px 16px calc(16px + env(safe-area-inset-bottom,0));
}
@media (min-width:621px){ .ov{ align-items:center; padding:16px; } .sheet{ border-radius:18px; } }
.sheet h2{ margin:0 0 4px; font-size:1.2rem; color:var(--navy); }
.sheet p.lead{ margin:0 0 12px; color:var(--muted); font-size:.9rem; }
.cat{
  display:flex; align-items:center; gap:12px; min-height:48px; padding:6px 12px; margin-bottom:8px;
  border:1.5px solid var(--line); border-radius:12px; cursor:pointer; font-weight:600;
}
.cat input{ width:20px; height:20px; accent-color:var(--navy); flex-shrink:0; }
.cat.on{ border-color:var(--navy); background:#F3F7FB; }
.cnt{ text-align:right; font-size:.75rem; color:var(--muted); margin-top:4px; }
.err{ color:var(--danger); font-size:.85rem; font-weight:600; margin:10px 0 0; min-height:1.2em; }
.toast{
  position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0)); transform:translateX(-50%);
  background:#0F172A; color:#fff; padding:11px 16px; border-radius:12px; font-weight:600; font-size:.9rem; z-index:70; max-width:92vw;
}
.skel{ height:14px; border-radius:7px; background:linear-gradient(90deg,#EEF1F4,#F8FAFB,#EEF1F4); background-size:200% 100%; animation:sk 1.2s linear infinite; margin:12px 0; }
@keyframes sk{ 0%{background-position:200% 0} 100%{background-position:-200% 0} }
</style>
</head>
<body>
<header class="bar">
  <a class="brandrow" href="https://masumcpex.com" target="_blank" rel="noopener noreferrer" aria-label="Masum Cpex website (opens in a new tab)"><div class="mark" aria-hidden="true"><img src="masum2.png" alt="" decoding="async" onerror="this.parentNode.textContent='M'"></div><div class="brand">WORKTRACK<small>Attendance &amp; Workforce Management</small></div></a>
  <span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>View only</span>
</header>
<main id="app" aria-live="polite">
  <div class="card"><div class="skel" style="width:40%"></div><div class="skel" style="width:70%;height:24px"></div><div class="skel"></div><div class="skel" style="width:85%"></div></div>
</main>
<footer><div class="byline"><img src="masum.webp" alt="" decoding="async" onerror="this.style.display='none'">Prepared by Masum Cpex</div><br><div class="sec"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Secure view-only link</div><div>© <span id="yr">2026</span> Masum Cpex · <a href="mailto:info@masumcpex.com">info@masumcpex.com</a></div></footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, doc, getDoc, collection, writeBatch, serverTimestamp, increment
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-lite.js";

const CONTACT = "info@masumcpex.com";
const H2C = "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
const JSPDF = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
const QRLIB = "https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js";
async function qrFor(text){
  try{
    if(typeof window.qrcode !== "function") await loadScript(QRLIB);
    if(typeof window.qrcode !== "function") return "";
    const qr = window.qrcode(0, "M"); qr.addData(text); qr.make();
    return qr.createDataURL(6, 12);
  }catch(e){ return ""; }
}
const CATS = {
  status: "Incorrect attendance status", hours: "Incorrect work hours", missing: "Missing attendance record",
  leave: "Incorrect leave record", duplicate: "Duplicate attendance", date: "Incorrect date", other: "Other"
};
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const ICON_FLAG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4"/><path d="M5 4h11l-1.5 4L16 12H5"/></svg>';
const ICON_DL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M5 21h14"/></svg>';
const ICON_LOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
const ICON_OK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

const app = document.getElementById("app");
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
const fmtH = n => String(Math.round((Number(n) || 0) * 100) / 100);
const dayLabel = d => { const [y,m,dd] = d.split("-").map(Number); return String(dd).padStart(2,"0") + " " + MONTHS[m-1]; };
const fullLabel = d => dayLabel(d) + " " + d.slice(0,4);
const weekday = d => { const [y,m,dd] = d.split("-").map(Number); return new Date(y, m-1, dd).toLocaleDateString("en-US", { weekday: "long" }); };
const monthLabel = ym => MONTHS[Number(ym.slice(5,7)) - 1] + " " + ym.slice(0,4);
const moneyRM = n => { const v = Number(n) || 0; return (v < 0 ? "− " : "") + "RM " + Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
const rateTxt = n => { let t = (Math.round((Number(n) || 0) * 10000) / 10000).toFixed(4).replace(/0+$/, ""); if(/\.\d$/.test(t)) t += "0"; if(t.endsWith(".")) t += "00"; return t; };
const ekey = ym => "m" + ym.replace("-", "");
const ICON_EARN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6 10v.01M18 14v.01"/></svg>';


const params = new URLSearchParams(location.search);
const token = params.get("token") || "";
const TOKEN_OK = /^[A-Za-z0-9_-]{12,80}$/.test(token);

let db = null, share = null, curYm = "";

function unavailable(title, text){
  app.innerHTML = `<div class="card hero"><div class="state"><div class="ico">${ICON_LOCK}</div><h2>${esc(title)}</h2><p>${esc(text)}</p>
    <div class="help">Think this is a mistake? Ask the administrator for a new link.<br><a class="btn sec" href="mailto:${CONTACT}">Contact ${CONTACT}</a></div></div></div>`;
}
function toast(t){
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = t; document.body.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

async function load(){
  if(!TOKEN_OK){ unavailable("Access Unavailable", "This attendance link is not valid."); return; }
  app.innerHTML = `<div class="card"><div class="skel" style="width:40%"></div><div class="skel" style="width:70%;height:24px"></div><div class="skel"></div><div class="skel" style="width:85%"></div></div>`;
  try{
    if(!db){
      const fb = initializeApp({
        apiKey: "AIzaSyDp8J-8XI-wGtn3MYNjauEyDHolt7WhnCY",
        authDomain: "masumcpex-f65cf.firebaseapp.com",
        projectId: "masumcpex-f65cf",
        appId: "1:535080144365:web:2836f3fd49f33d4cf76be4"
      });
      db = getFirestore(fb);
    }
    const snap = await getDoc(doc(db, "attendance_shares", token));
    if(!snap.exists()){ unavailable("Access Unavailable", "This attendance link is not valid."); return; }
    const data = snap.data();
    if(data.active !== true){ unavailable("Access Unavailable", "This attendance sharing link has been disabled."); return; }
    share = data;
    share.records = Array.isArray(data.records) ? data.records : [];
    const months = monthsList();
    curYm = months[0] || "";
    render();
  }catch(err){
    console.error(err);
    const denied = err && (err.code === "permission-denied" || err.code === "unauthenticated");
    if(denied){ unavailable("Access Unavailable", "This attendance link cannot be opened."); return; }
    app.innerHTML = `<div class="card"><div class="state"><h2>Couldn't load</h2><p>Please check your internet connection and try again.</p><div class="actions" style="justify-content:center"><button class="btn" id="retry" style="flex:0 1 200px">Try again</button></div></div></div>`;
    document.getElementById("retry").onclick = load;
  }
}

function monthsList(){
  return Array.from(new Set(share.records.map(r => r.d.slice(0,7)))).sort().reverse();
}
function monthRecords(ym){
  return share.records.filter(r => r.d.startsWith(ym)).sort((a,b) => b.d.localeCompare(a.d));
}
function stats(list){
  let duty = 0, leave = 0, hours = 0;
  list.forEach(r => { if(r.s === "duty"){ duty++; hours += Number(r.h) || 0; } else leave++; });
  return { duty, leave, hours };
}

function render(){
  const months = monthsList();
  const list = monthRecords(curYm);
  const st = stats(list);
  let updated = "";
  try{ if(share.updatedAt && share.updatedAt.toDate){ const u = share.updatedAt.toDate(); updated = "Last updated " + String(u.getDate()).padStart(2,"0") + " " + MONTHS[u.getMonth()].slice(0,3) + " " + u.getFullYear(); } }catch(_){}
  const name = share.memberName || "";
  const rate = (st.duty + st.leave) ? Math.round(st.duty / (st.duty + st.leave) * 100) : 0;
  const avg = st.duty ? fmtH(st.hours / st.duty) : "0";
  const eg = months.length ? earningsFor(curYm) : null;
  app.innerHTML = `
    <section class="card hero">
      <div class="herotop">
        <div class="avatar" aria-hidden="true">${esc((name.trim().charAt(0) || "?").toUpperCase())}</div>
        <div><p class="eyebrow">Shared Attendance</p><h1>${esc(name)}</h1>${updated ? `<p class="sub">${esc(updated)}</p>` : ""}</div>
      </div>
      ${months.length ? `<label class="fl" for="month">Month</label>
      <select id="month">${months.map(m => `<option value="${m}"${m === curYm ? " selected" : ""}>${monthLabel(m)}</option>`).join("")}</select>` : ""}
    </section>
    ${months.length ? `
    <div class="tiles">
      <div class="tile t-ok"><b>${st.duty}</b><span>Work Days</span></div>
      <div class="tile t-lv"><b>${st.leave}</b><span>Leave Days</span></div>
      <div class="tile"><b>${fmtH(st.hours)}</b><span>Total Hours</span></div>
    </div>
    <section class="card rate">
      <div class="ratehead"><span>Attendance rate</span><b>${rate}%</b></div>
      <div class="bar2" role="img" aria-label="Attendance rate ${rate} percent"><i style="width:${rate}%"></i></div>
      <div class="ratefoot">Average ${avg}h per work day · ${monthLabel(curYm)}</div>
    </section>
    ${eg ? `<section class="card earn">

app.addEventListener("change", e => {

});
app.addEventListener("click", e => {
  const f = e.target.closest(".flag");

  if(e.target.closest("#repBtn")) openReport("");

// ---- Report an issue ----
function openReport(preDate){
  const dates = share.records.map(r => r.d).sort().reverse();
  const ov = document.createElement("div");
  ov.className = "ov";
  ov.innerHTML = `
    <div class="sheet" role="dialog" aria-modal="true" aria-label="Report an Attendance Issue">
      <div id="repForm">
        <h2>Report an Attendance Issue</h2>
        <p class="lead">Please select the issue you want to report.</p>
        ${Object.entries(CATS).map(([k, v]) => `<label class="cat"><input type="radio" name="cat" value="${k}"><span>${v}</span></label>`).join("")}
        <label class="fl" for="rdate">Related date</label>
        <select id="rdate"><option value="">Select attendance date</option>${dates.map(d => `<option value="${d}"${d === preDate ? " selected" : ""}>${fullLabel(d)}</option>`).join("")}</select>
        <label class="fl" for="rmsg">Additional details</label>
        <textarea id="rmsg" rows="4" maxlength="500" placeholder="Please describe the issue..."></textarea>
        <div class="cnt"><span id="rcnt">0</span>/500</div>
        <p class="err" id="rerr"></p>
        <div class="actions">
          <button class="btn" id="rsubmit">Submit Report</button>
          <button class="btn sec" id="rcancel">Cancel</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(ov);
  const close = () => { document.removeEventListener("keydown", onKey); ov.remove(); };
  const onKey = e => { if(e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  const q = s => ov.querySelector(s);
  ov.addEventListener("click", e => { if(e.target === ov) close(); });
  q("#rcancel").onclick = close;
  q("#rmsg").addEventListener("input", () => { q("#rcnt").textContent = q("#rmsg").value.length; });
  ov.addEventListener("change", e => {
    if(e.target.name === "cat") ov.querySelectorAll(".cat").forEach(l => l.classList.toggle("on", l.querySelector("input").checked));
  });

  q("#rsubmit").onclick = async () => {
    const cat = (ov.querySelector('input[name="cat"]:checked') || {}).value || "";
    const date = q("#rdate").value;
    const msg = q("#rmsg").value.trim();
    const err = q("#rerr");
    if(!cat){ err.textContent = "Please select an issue type."; return; }
    if(cat === "other" && msg.length < 5){ err.textContent = "Please describe the issue (at least 5 characters)."; return; }
    if(!date && cat !== "missing" && cat !== "other"){ err.textContent = "Please select the related date."; return; }
    try{
      const last = Number(localStorage.getItem("wt_rep_ts") || 0);
      const wait = 60 - Math.floor((Date.now() - last) / 1000);
      if(wait > 0){ err.textContent = "Please wait " + wait + " seconds before sending another report."; return; }
    }catch(_){}
    err.textContent = "";
    const btn = q("#rsubmit"); btn.disabled = true; btn.textContent = "Sending...";
    try{
      // The backend (Firestore Rules) checks the token, and that member/owner/name match the share document.
      const batch = writeBatch(db);
      batch.set(doc(collection(db, "attendance_reports")), {
        token, ownerId: share.ownerId, memberId: share.memberId, memberName: share.memberName,
        date, category: cat, message: msg, status: "open", createdAt: serverTimestamp()
      });
      batch.update(doc(db, "attendance_shares", token), { lastReportAt: serverTimestamp(), reportCount: increment(1) });
      await batch.commit();
      try{ localStorage.setItem("wt_rep_ts", String(Date.now())); }catch(_){}
      q("#repForm").innerHTML = `
        <div class="state">
          <div class="ico ok">${ICON_OK}</div>
          <h2>Report submitted successfully</h2>
          <p>Thank you. Your report has been sent to the administrator for review.</p>
          <p style="margin-top:10px">If you need to provide additional information, please contact: <a href="mailto:${CONTACT}">${CONTACT}</a></p>
          <div class="actions"><button class="btn" id="rdone">Done</button></div>
        </div>`;
      q("#rdone").onclick = close;
    }catch(e2){
      console.error(e2);
      btn.disabled = false; btn.textContent = "Submit Report";
      err.textContent = (e2 && e2.code === "permission-denied")
        ? "The report could not be sent. The link may have been disabled, or you may be sending reports too quickly. Please wait a minute and try again."
        : "Couldn't send the report. Please check your connection and try again.";
    }
  };
}

function loadScript(src){
  return new Promise((res, rej) => {

    document.head.appendChild(s);
  });
}

// Earnings are shown only while they still match the attendance (otherwise the owner has changed something and must publish again).
function earningsFor(ym){
  const raw = share.earnings && share.earnings[ekey(ym)];
  if(!raw || typeof raw !== "object" || !(Number(raw.rate) > 0)) return null;
  const st = stats(monthRecords(ym));
  if(Math.abs((Number(raw.hours) || 0) - st.hours) > 0.005 || raw.days !== st.duty || raw.leave !== st.leave) return null;
  return raw;
}
function pdfPagesHtml(ym, list){
  const asc = list.slice().sort((a, b) => a.d.localeCompare(b.d));
  const st = stats(asc);
  const FIRST = 22, NEXT = 28;
  const chunks = [asc.slice(0, FIRST)];
  for(let i = FIRST; i < asc.length; i += NEXT) chunks.push(asc.slice(i, i + NEXT));
  const gen = new Date(); const genTxt = String(gen.getDate()).padStart(2,"0") + " " + MONTHS[gen.getMonth()].slice(0,3) + " " + gen.getFullYear();
  const th = "text-align:left;padding:9px 10px;font-size:12px;color:#fff;background:#173B63;";
  const table = rows => `<table style="width:100%;border-collapse:collapse;font-size:13px;"><thead><tr>
      <th style="${th}">Date</th><th style="${th}">Day</th><th style="${th}">Status</th><th style="${th}text-align:right;">Hours</th></tr></thead><tbody>
      ${rows.map((r, i) => `<tr style="background:${i % 2 ? "#F6F8FA" : "#fff"};height:34px;">
        <td style="padding:0 10px;font-weight:600;">${fullLabel(r.d)}</td><td style="padding:0 10px;color:#667085;">${weekday(r.d)}</td>
        <td style="padding:0 10px;color:${r.s === "duty" ? "#0F766A" : "#9C6B0F"};font-weight:700;">${r.s === "duty" ? "Present" : "Leave"}</td>
        <td style="padding:0 10px;text-align:right;font-weight:700;">${r.s === "duty" ? fmtH(r.h) + "h" : "—"}</td></tr>`).join("")}
      </tbody></table>`;
  const kpi = (l, v) => `<div style="flex:1;background:#F3F6F9;border-radius:10px;padding:12px;text-align:center;"><div style="font-size:22px;font-weight:800;color:#173B63;">${v}</div><div style="font-size:11px;color:#667085;font-weight:600;">${l}</div></div>`;
  const page = (inner, n, total) => `<div class="pdfp" style="width:794px;height:1123px;padding:44px 48px;background:#fff;position:relative;font-family:${getComputedStyle(document.body).fontFamily};color:#172033;">
      ${inner}
      <div style="position:absolute;left:48px;right:48px;bottom:26px;display:flex;justify-content:space-between;font-size:11px;color:#98A2B3;border-top:1px solid #EEF1F4;padding-top:8px;">
        <span>Generated ${genTxt} · View-only attendance report</span><span>Page ${n} of ${total}</span></div></div>`;
  const total = chunks.length;
  return chunks.map((rows, i) => page(i === 0 ? `
      <div style="background:#173B63;color:#fff;border-radius:12px;padding:18px 20px;margin-bottom:18px;">
        <div style="font-size:12px;letter-spacing:.12em;opacity:.8;">WORKTRACK · ATTENDANCE REPORT</div>
        <div style="font-size:26px;font-weight:800;margin-top:4px;">${esc(share.memberName)}</div>
        <div style="font-size:14px;opacity:.9;margin-top:2px;">${monthLabel(ym)}</div></div>
      <div style="display:flex;gap:10px;margin-bottom:18px;">${kpi("Work Days", st.duty)}${kpi("Leave Days", st.leave)}${kpi("Total Hours", fmtH(st.hours))}</div>
      ${table(rows)}` : table(rows), i + 1, total)).join("");
}
async function downloadPdf(btn){
  const list = monthRecords(curYm);
  if(!list.length){ toast("No records for this month."); return; }
  const old = btn.innerHTML; btn.disabled = true; btn.textContent = "Preparing PDF...";
  let wrap = null;
  try{
    await Promise.all([window.html2canvas ? 0 : loadScript(H2C), window.jspdf ? 0 : loadScript(JSPDF)]);
    wrap = document.createElement("div");
    wrap.style.cssText = "position:fixed;left:-10000px;top:0;width:794px;";
    wrap.innerHTML = pdfPagesHtml(curYm, list);
    document.body.appendChild(wrap);
    const pdf = new window.jspdf.jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
    const pages = wrap.querySelectorAll(".pdfp");
    for(let i = 0; i < pages.length; i++){
      const canvas = await window.html2canvas(pages[i], { scale: 3, backgroundColor: "#ffffff", useCORS: true, logging: false });
      if(i) pdf.addPage();
      pdf.addImage(canvas.toDataURL("image/jpeg", 0.98), "JPEG", 0, 0, 210, 297);
    }
    const safe = String(share.memberName).replace(/[^\p{L}\p{N}]+/gu, "-").replace(/^-+|-+$/g, "") || "member";
    pdf.save("attendance-" + safe + "-" + curYm + ".pdf");
  }catch(err){
    console.error(err);
    toast("Couldn't create the PDF. Please check your connection and try again.");
  }finally{
    if(wrap) wrap.remove();
    btn.disabled = false; btn.innerHTML = old;
  }
}

async function downloadEarnings(btn){
  const raw = earningsFor(curYm);
  if(!raw){ toast("Earnings are not available for this month."); return; }
  const old = btn.innerHTML; btn.disabled = true; btn.textContent = "Preparing PDF...";
  let wrap = null;
  try{
    await Promise.all([window.html2canvas ? 0 : loadScript(H2C), window.jspdf ? 0 : loadScript(JSPDF)]);
    const E = {
      name: share.memberName, ym: curYm, rate: raw.rate, hours: raw.hours, days: raw.days, leave: raw.leave, gross: raw.gross, ded: raw.ded, net: raw.net,
      taken: raw.taken, balance: raw.balance, att: raw.att, avg: raw.avg, weeks: Array.isArray(raw.weeks) ? raw.weeks : [], longest: raw.longest || null, rid: raw.rid || "", linkUrl: location.origin + location.pathname + location.search
    };
    E.qr = E.linkUrl ? await qrFor(E.linkUrl) : "";
    wrap = document.createElement("div");
    wrap.className = "earn-root";
    wrap.style.cssText = "position:fixed;left:-10000px;top:0;width:800px;background:#fff;padding:38px 34px 26px;font-family:Inter,'Hind Siliguri',system-ui,sans-serif;color:#172033;";
    wrap.innerHTML = buildEarningsSections(E);
    document.body.appendChild(wrap);
    const canvas = await window.html2canvas(wrap, { scale: 3, backgroundColor: "#ffffff", useCORS: true, logging: false });
    const pdf = new window.jspdf.jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
    const availH = 275;                                   // keep clear of the footer
    let w = 210, h = canvas.height / canvas.width * 210;
    if(h > availH){ w = w * availH / h; h = availH; }
    pdf.addImage(canvas.toDataURL("image/jpeg", 0.98), "JPEG", (210 - w) / 2, 0, w, h);
    // Make the "Open attendance report" box clickable (opens this member's day-by-day records).
    const lb = wrap.querySelector("#khEarnLinkBox");
    if(lb && E.linkUrl){
      const wr = wrap.getBoundingClientRect(), r = lb.getBoundingClientRect();
      pdf.link((210 - w) / 2 + (r.left - wr.left) / wr.width * w, (r.top - wr.top) / wr.height * h, r.width / wr.width * w, r.height / wr.height * h, { url: E.linkUrl });
    }
    const gen = new Date(); const genTxt = String(gen.getDate()).padStart(2, "0") + " " + MONTHS[gen.getMonth()].slice(0, 3) + " " + gen.getFullYear();
    pdf.setDrawColor(228, 231, 236); pdf.setLineWidth(0.2); pdf.line(16, 281, 194, 281);
    pdf.setFont("helvetica", "bold"); pdf.setFontSize(7.5); pdf.setTextColor(23, 32, 51); pdf.text("masumcpex.com", 16, 286);
    pdf.setFont("helvetica", "normal"); pdf.setTextColor(102, 112, 133);
    pdf.text("Report ID: " + (E.rid || "-"), 105 - 15, 286);
    pdf.text("Generated: " + genTxt, 194, 286, { align: "right" });
    pdf.text("info@masumcpex.com", 16, 290);
    const safe = String(share.memberName).replace(/[^\p{L}\p{N}]+/gu, "-").replace(/^-+|-+$/g, "") || "member";
    pdf.save("earnings-summary-" + safe + "-" + curYm + ".pdf");
  }catch(err){
    console.error(err);
    toast("Couldn't create the PDF. Please check your connection and try again.");
  }finally{
    if(wrap) wrap.remove();
    btn.disabled = false; btn.innerHTML = old;
  }
}
