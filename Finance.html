    const ok = await confirmDialog({
      title: "সব ডেটা মুছবেন?",
      message: "আপনার একাউন্টের সব আয়, খরচ, পরিবার-সহায়তা ও সম্পূর্ণ-চিহ্ন ক্লাউড থেকে স্থায়ীভাবে মুছে যাবে। এটি ফেরানো যাবে না।",
      extra: `<button type="button" class="btn sm" data-act="export-json">${icon("download", "sm")} আগে ব্যাকআপ নিন</button>`,
      confirmLabel: "সব মুছুন",
      danger: true,
      requireText: "DELETE"
    });
    if (!ok) return;
    try {
      let n = 0;
      for (const table of [...STORES, "completion"]) {
        const rows = await cloud.listAll(table);
        for (const row of rows) {
          await cloud.deleteRow(table, row.$id);
          n++;
          if (n % 5 === 0) toast(`মোছা হচ্ছে… ${n}টি`);
        }
      }
      await reloadState();
    } catch (err) {
      toast(failMessage(err));
      try {
        await reloadState();
        render();
      } catch (ignored) {
        return;
      }
      return;
    }
    ui.restore = null;
    render();
    toast("সব ডেটা মুছে ফেলা হয়েছে");
  }

  async function logout() {
    const sure = await confirmDialog({
      title: "সাইন আউট করবেন?",
      message: "আপনি এই ডিভাইস থেকে সাইন আউট হয়ে যাবেন। আপনার ডেটা ক্লাউডে নিরাপদ থাকবে, আবার লগইন করলেই পাবেন।",
      confirmLabel: "সাইন আউট",
      danger: true
    });
    if (!sure) return;
    try {
      await cloud.logout();
    } catch (err) {
      writeStorage(FALLBACK_KEY, "");
    }
    state.user = null;
    state.income = [];
    state.expenses = [];
    state.support = [];
    state.completion = {};
    state.completionIds = {};
    state.legacy = null;
    state.loadError = null;
    ui.restore = null;
    ui.auth.mode = "login";
    render();
    toast("সাইন আউট হয়েছে");
  }

  async function previewLegacy() {
    const l = state.legacy;
    if (!l) return;
    const v = C.validateBackup(C.buildBackup(l, l.completion, new Date().toISOString()));
    if (!v.ok) ui.restore = { fileName: "এই ডিভাইসের লোকাল ডেটা", errors: v.errors, errorCount: v.errorCount };
    else ui.restore = { fileName: "এই ডিভাইসের লোকাল ডেটা", backup: v, plan: C.planImport(state, state.completion, v, "merge") };
    refreshRestore();
    const el = $("#restore-region");
    if (el) el.scrollIntoView({ block: "center" });
  }

  async function deleteLegacy() {
    const ok = await confirmDialog({
      title: "লোকাল কপি মুছবেন?",
      message: "এই ব্রাউজারের পুরনো লোকাল ডেটা মুছে যাবে। ক্লাউডে তোলা না থাকলে এই ডেটা আর ফিরবে না।",
      confirmLabel: "মুছুন",
      danger: true
    });
    if (!ok) return;
    await new Promise((resolve) => {
      const req = indexedDB.deleteDatabase(LEGACY_DB);
      req.onsuccess = () => resolve();
      req.onerror = () => resolve();
      req.onblocked = () => resolve();
    });
    state.legacy = null;
    render();
    toast("লোকাল কপি মুছে ফেলা হয়েছে");
  }

  async function handleAct(el) {
    const act = el.dataset.act;
    const recordAct = /^(add|edit|del)-(income|expenses|support)$/.exec(act);
    if (recordAct) {
      const [, verb, store] = recordAct;
      const existing = verb === "add" ? null : state[store].find((x) => x.id === el.dataset.id);
      if (verb !== "add" && !existing) return;
      if (verb === "del") await removeRecord(store, el.dataset.id);
      else if (store === "income") incomeForm(existing);
      else if (store === "expenses") expenseForm(existing);
      else supportForm(existing);
      return;
    }
    if (act === "set-lang") { if (el.dataset.id !== LANG) { lsSet("fin-lang", el.dataset.id === "en" ? "en" : "bn"); location.reload(); } return; }
    if (act === "set-theme") { lsSet("fin-theme", ["dark", "system"].includes(el.dataset.id) ? el.dataset.id : "light"); applyTheme(); render(); return; }
    if (act === "loan-add") { loanForm(null); return; }
    if (act === "loan-tab") { ui_loans.tab = el.dataset.id === "borrowed" ? "borrowed" : "lent"; render(); return; }
    if (/^loan-(pay|view|edit|del)$/.test(act)) { loanActs(act, el.dataset.id); return; }
    switch (act) {
      case "month-prev":
      case "month-next": {
        const nk = C.shiftMonth(monthlyKey(), act === "month-prev" ? -1 : 1);
        ui.monthly.y = nk.slice(0, 4);
        ui.monthly.m = String(Number(nk.slice(5)));
        render();
        break;
      }
      case "set-complete":
        await setCompletion(el.dataset.month, el.dataset.value === "1");
        break;
      case "export-json":
        await exportJson();
        break;
      case "export-pdf":
        exportPdf(el.dataset.kind);
        break;
      case "export-csv":
        exportCsv(el.dataset.kind);
        break;
      case "cancel-restore":
        ui.restore = null;
        refreshRestore();
        break;
      case "do-import":
        await runImport();
        break;
      case "erase":
        await eraseAll();
        break;
      case "copy": {
        const v = el.getAttribute("data-copy") || "";
        if (navigator.clipboard && v) {
          navigator.clipboard.writeText(v).then(() => toast("কপি হয়েছে"), () => toast("কপি করা যায়নি"));
        }
        break;
      }
      case "contact-send": {
        const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        const form = $("#contactForm");
        const status = $("#formStatus");
        const btn = $("#cfSubmit");
        const val = (id) => (($(id, form) || {}).value || "").trim();
        const setErr = (id, msg) => {
          const input = $(id, form);
          const fld = input.closest(".fld");
          const old = $(".err", fld);
          if (old) old.remove();
          if (msg) {
            const sp = document.createElement("span");
            sp.className = "err";
            sp.setAttribute("role", "alert");
            sp.textContent = msg;
            fld.appendChild(sp);
            input.setAttribute("aria-invalid", "true");
          } else input.removeAttribute("aria-invalid");
        };
        const nm = val("#cf-name"), em = val("#cf-email"), sb = val("#cf-subject"), ms = val("#cf-message");
        let valid = true;
        const chk = (id, ok, msg) => { setErr(id, ok ? "" : msg); if (!ok) valid = false; };
        chk("#cf-name", !!nm, "নাম দিন।");
        if (!em) chk("#cf-email", false, "ইমেইল দিন।");
        else chk("#cf-email", EMAIL_RE.test(em), "সঠিক ইমেইল ঠিকানা দিন।");
        chk("#cf-subject", !!sb, "বিষয় লিখুন।");
        chk("#cf-message", !!ms, "বার্তা লিখুন।");
        if (!valid) {
          status.textContent = "অনুগ্রহ করে চিহ্নিত ঘরগুলো ঠিক করুন।";
          status.className = "form-status err";
          break;
        }
        btn.classList.add("loading");
        btn.disabled = true;
        status.textContent = "";
        status.className = "form-status";
        setTimeout(() => {
          location.href = `mailto:${CONTACT.primary}?subject=${encodeURIComponent(sb)}&body=${encodeURIComponent(ms + "\n\n— " + nm + "\nইমেইল: " + em)}`;
          btn.classList.remove("loading");
          btn.disabled = false;
          status.textContent = "ধন্যবাদ! আপনার ইমেইল অ্যাপ খুলেছে, সেখান থেকে সেন্ড করুন।";
          status.className = "form-status ok";
        }, 600);
        break;
      }
      case "logout":
        await logout();
        break;
      case "google":
        cloud.googleLogin();
        break;
      case "soon":
        toast("এই সুবিধা এখনো চালু হয়নি।");
        break;
      case "toggle-pass": {
        const input = el.parentElement.querySelector("input");
        if (input) {
          const show = input.type === "password";
          input.type = show ? "text" : "password";
          el.innerHTML = icon(show ? "eye" : "eye-off");
          el.setAttribute("aria-label", show ? "Hide password" : "Show password");
        }
        break;
      }
      case "auth-mode":
        ui.auth.mode = el.dataset.value === "signup" ? "signup" : "login";
        render();
        break;
      case "retry-start":
        await boot();
        break;
      case "retry-load":
        try {
          await reloadState();
          state.loadError = null;
        } catch (err) {
          state.loadError = err;
        }
        render();
        break;
      case "legacy-preview":
        await previewLegacy();
        break;
      case "legacy-delete":
        await deleteLegacy();
        break;
      case "install":
        if (deferredPrompt) {
          deferredPrompt.prompt();
          deferredPrompt = null;
          render();
        }
        break;
      default:
        break;
    }
  }

  function applyFilter(el) {
    const [page, field] = el.dataset.filter.split(".");
    ui[page][field] = el.value;
    if (page === "monthly" || page === "yearly") {
      render();
      const again = document.querySelector(`[data-filter="${el.dataset.filter}"]`);
      if (again) again.focus();
      return;
    }
    refreshRegion();
  }

  view.addEventListener("submit", async (e) => {
    if (e.target.id !== "auth-form") return;
    e.preventDefault();
    if (ui.authBusy) return;
    const form = e.target;
    clearErrors(form);
    const raw = Object.fromEntries(new FormData(form));
    const signup = ui.auth.mode === "signup";
    const email = String(raw.email || "").trim();
    const password = String(raw.password || "");
    const errors = {};
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) errors.email = "সঠিক ইমেইল দিন।";
    if (password.length < 8) errors.password = "পাসওয়ার্ড কমপক্ষে ৮ অক্ষরের হতে হবে।";
    if (signup && String(raw.confirm || "") !== password) errors.confirm = "পাসওয়ার্ড দুটো মেলেনি।";
    if (Object.keys(errors).length) {
      showErrors(form, errors);
      return;
    }
    ui.authBusy = true;
    const button = form.querySelector('button[type="submit"]');
    const label = button.textContent;
    button.disabled = true;
    button.textContent = "অপেক্ষা করুন…";
    try {
      if (signup) await cloud.signUp(String(raw.name || "").trim(), email, password);
      const user = await cloud.login(email, password);
      await enter(user);
      render();
    } catch (err) {
      const message =
        err.status === 401 ? "ইমেইল বা পাসওয়ার্ড ভুল।" : err.status === 409 && signup ? "এই ইমেইলে আগে থেকেই একাউন্ট আছে। লগইন করুন।" : errorMessage(err);
      showErrors(form, { _form: message });
      button.disabled = false;
      button.textContent = label;
    } finally {
      ui.authBusy = false;
    }
  });
  function printPage() {
    const id = currentRoute();
    if (id === "loans") { toast("ঋণ ও পাওনা ডাউনলোডে আসে না"); return; }
    const page = PAGES[id] || { title: "Report" };
    const d = new Date();
    const stamp = d.toISOString().slice(0, 10);
    view.dataset.printTitle = `Finance Tracker — ${page.title} — ${d.toLocaleDateString("en-GB")}`;
    const oldTitle = document.title;
    document.title = `Finance-${page.title.replace(/[^A-Za-z0-9]+/g, "-")}-${stamp}`;
    const restore = () => {
      document.title = oldTitle;
      window.removeEventListener("afterprint", restore);
    };
    window.addEventListener("afterprint", restore);
    window.print();
  }
  document.addEventListener("click", (e) => {
    if (e.target.closest("[data-pdf]")) printPage();
  });
  view.addEventListener("click", (e) => {
    const el = e.target.closest("[data-act]");
    if (el) handleAct(el);
  });
  view.addEventListener("input", (e) => {
    const ct = e.target.closest("#contactForm");
    if (ct && e.target.name) {
      const fld = e.target.closest(".fld");
      const er = fld && fld.querySelector(".err");
      if (er) er.remove();
      e.target.removeAttribute("aria-invalid");
    }
    const lf = e.target.closest("[data-lf]");
    if (lf) {
      ui_loans[lf.dataset.lf] = lf.value;
      const reg = $("#loan-region");
      if (reg) reg.innerHTML = loansRegion();
      return;
    }
    const el = e.target.closest("[data-filter]");
    if (el) applyFilter(el);
  });
  view.addEventListener("change", (e) => {
    if (e.target.id === "restore-file") {
      handleRestoreFile(e.target.files && e.target.files[0]);
      return;
    }
    const el = e.target.closest("[data-filter]");
    if (el && el.tagName === "SELECT") applyFilter(el);
  });
  dlg.addEventListener("click", (e) => {
    if (e.target.closest("[data-close]")) {
      dlg.close();
      return;
    }
    const el = e.target.closest("[data-act]");
    if (el) handleAct(el);
  });
  $("#skip").addEventListener("click", (e) => {
    e.preventDefault();
    view.focus();
  });

  window.addEventListener("hashchange", render);
  window.addEventListener("online", () => {
    updateNet();
    if (state.bootError) boot();
  });
  window.addEventListener("offline", updateNet);
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;
    if (currentRoute() === "settings" && !dlg.open) render();
  });
  window.addEventListener("appinstalled", () => {
    deferredPrompt = null;
  });
  document.addEventListener("visibilitychange", async () => {
    if (document.visibilityState !== "visible" || !state.ready || !state.user || state.loadError || dlg.open || ui.importing) return;
    try {
      await reloadState();
      render();
    } catch (ignored) {
      return;
    }
  });

  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/service-worker.js", { updateViaCache: "none" }).catch(() => {});
    });
  }

  async function boot() {
    state.ready = false;
    state.bootError = null;
    render();
    let oauthMsg = "";
    const q = new URLSearchParams(location.search);
    if (q.has("oauth") || q.has("userId")) {
      const userId = q.get("userId");
      const secret = q.get("secret");
      history.replaceState(null, "", location.pathname + location.hash);
      if (userId && secret) {
        try {
          await cloud.finishOAuth(userId, secret);
        } catch (err) {
          oauthMsg = errorMessage(err);
        }
      } else if (q.get("oauth") === "fail") {
        oauthMsg = "Google দিয়ে লগইন হয়নি। Appwrite-এ Google প্রোভাইডার চালু আছে কিনা দেখুন, তারপর আবার চেষ্টা করুন।";
      }
    }
    try {
      const pre = readStorage(FALLBACK_KEY) ? fetchAllTables() : null;
      const user = await cloud.account();
      await enter(user, pre);
    } catch (err) {
      state.user = null;
      if (err.status !== 401 && err.status !== 400) state.bootError = err;
    }
    state.ready = true;
    render();
    if (oauthMsg) toast(oauthMsg);
  }

  function start() {
    buildNav();
    updateNet();
    boot();
  }

  start();
})();
</script>
</body>
</html>
