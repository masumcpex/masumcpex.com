/* 04 অধ্যায়ের নতুন গল্পগুলো: আলাদা, শান্ত ও প্রিমিয়াম সম্পাদকীয় ধাঁচ (আইভরি + কালি + গাঢ় বারগান্ডি) */
.story-item.story-item--new{
  --kh-paper:#FBF8F2; --kh-line:#E8DFD1; --kh-ink:#2A2420; --kh-text:#3B342D; --kh-soft:#7A6F63; --kh-accent:#7A2E3B;
  background:var(--kh-paper); border:1px solid var(--kh-line); border-radius:12px;
  box-shadow:0 1px 2px rgba(42,36,32,.04),0 10px 26px rgba(42,36,32,.06);
}
.story-item.story-item--new .story-summary{ color:var(--kh-ink); -webkit-text-fill-color:var(--kh-ink); padding:1.1rem 1.35rem; gap:.9rem; }
.story-item.story-item--new .story-summary:focus-visible{ outline:2px solid var(--kh-accent); outline-offset:-2px; border-radius:12px; }
.story-item.story-item--new .story-num{ color:var(--kh-accent); font-weight:700; min-width:2rem; padding-right:.85rem; border-right:1px solid var(--kh-line); letter-spacing:.04em; }
.story-item.story-item--new .story-chevron{ color:var(--kh-soft); display:inline-flex; align-items:center; }
.story-item.story-item--new .story-content{ background:var(--kh-paper); border-top:1px solid var(--kh-line); color:var(--kh-text); padding:.5rem 1.45rem 1.8rem; line-height:2; }
.story-item.story-item--new .story-content p{ color:var(--kh-text); margin:1.15rem 0 0; }
.story-item.story-item--new .kh-pain{
  font-weight:700; color:#6B2433;
  background:linear-gradient(to top, rgba(122,46,59,.14) 0, rgba(122,46,59,.14) .5em, transparent .5em);
  padding:0 .06em; -webkit-box-decoration-break:clone; box-decoration-break:clone;
}
.story-item.story-item--new .kh-closing{
  margin:2rem 0 0; padding:.25rem 0 .25rem 1.15rem; border-left:3px solid var(--kh-accent);
}
.story-item.story-item--new .kh-closing p{ margin:0; font-family:var(--font-display); font-size:1.12rem; line-height:1.95; color:var(--kh-ink); }
.story-item--new[open] > .story-content{ animation:khStoryOpen .28s ease both; }
@keyframes khStoryOpen{ from{ opacity:0; transform:translateY(-6px); } to{ opacity:1; transform:none; } }

.kh-door-intro{ text-align:center; padding:1.4rem .5rem; margin:.4rem 0 .2rem; border-top:1px solid #E8DFD1; border-bottom:1px solid #E8DFD1; }
.kh-door-label{ display:block; font-family:var(--font-display); font-weight:700; font-size:1.15rem; letter-spacing:.06em; color:#7A2E3B; }
.kh-door-intro p{ margin:.5rem auto 0; max-width:34rem; color:#7A6F63; font-size:.98rem; line-height:1.85; }
.kh-final-note{ margin:.6rem 0 0; padding:1.6rem 1.45rem; background:#FBF8F2; border:1px solid #E8DFD1; border-radius:12px; }
.kh-final-note p{ margin:0; color:#3B342D; font-size:1.02rem; line-height:2; }
.kh-final-source{ display:block; margin-top:1rem; text-align:right; color:#7A2E3B; font-size:.9rem; font-weight:600; letter-spacing:.03em; }

@media (max-width:520px){
  .story-item.story-item--new .story-summary{ padding:1rem 1rem; gap:.7rem; }
  .story-item.story-item--new .story-content{ padding:.4rem 1.1rem 1.5rem; }
  .story-item.story-item--new .kh-closing p{ font-size:1.05rem; }
  .kh-final-note{ padding:1.3rem 1.1rem; }
}
@media (prefers-reduced-motion:reduce){ .story-item--new[open] > .story-content{ animation:none; } }
